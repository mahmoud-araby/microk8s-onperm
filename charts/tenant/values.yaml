# -----------------------------------------------------------------------------
# charts/tenant - tenant landing zone (one Helm release per tenant).
#
# Binding interface: docs/chart-interfaces.md#chartstenant. Keys that belong to the
# interface are never renamed; keys marked "(extra)" are chart additions.
#
# Rendered by the ApplicationSet gitops/apps/applicationsets/tenants.yaml, which passes the
# `values:` block of gitops/tenants/<tenant>/tenant.yaml as helm.valuesObject.
#
# Two modes (see tenant.landingZone):
#   landing zone  (dedicated tenants and the "shared" pool tenant): the chart owns the namespace
#                 and renders Namespace, ResourceQuota, LimitRange, RBAC, NetworkPolicies, Istio
#                 policies, SecretStore - plus data provisioning and the Kong consumer.
#   pooled tenant (tier=shared, e.g. initech): the tenant has no namespace of its own; its services
#                 are the pooled releases in shared-services. The chart only renders per-tenant
#                 objects (suffixed with the tenant name) into shared-services: Kong consumer +
#                 rate limit, endpoints ConfigMap, optional data provisioning.
# -----------------------------------------------------------------------------

tenant:
  # -- Tenant id (DNS label, lowercase, max 20 chars). Used for namespace tenant-<name>, labels
  #    platform.example.com/tenant, Vault path secret/tenants/<name>, Kafka prefix "<name>.", ...
  name: acme
  # -- Human readable name (annotation only).
  displayName: ACME Corp
  # -- dedicated: own namespace + own service releases (<tenant>.api.example.com).
  #    shared:    served by the pooled releases in shared-services (api.example.com, tenant from JWT).
  tier: dedicated
  # -- Environment label (production | staging | ...).
  environment: production
  # -- (extra) Namespace override. Default: tenant-<name> for landing zones, shared-services for
  #    pooled (tier=shared) tenants. The "shared" pool tenant sets shared-services explicitly.
  namespace: ""
  # -- (extra) Render the namespace-scoped landing zone (Namespace, quota, RBAC, netpol, Istio, SecretStore).
  #    null = derived: true for tier=dedicated, false for tier=shared. The "shared" pool tenant sets true.
  landingZone: null
  # -- (extra) Keep the Namespace when the Argo CD Application is deleted/pruned
  #    (argocd.argoproj.io/sync-options: Prune=false,Delete=false). Set false only when decommissioning.
  protectNamespace: true
  # -- (extra) Release ring used by progressive delivery (canary | early | general); label only.
  releaseRing: general
  # -- (extra) Cost-centre / chargeback label.
  costCenter: ""
  # -- (extra) Additional labels / annotations for every rendered object.
  labels: {}
  annotations: {}

# -- (extra) Pod Security Admission labels on the namespace (restricted requires istio-cni for injection).
podSecurity:
  enforce: restricted
  audit: restricted
  warn: restricted
  version: latest

# -- ResourceQuota for the tenant namespace (landing zone only).
#    cpu/memory are *requests*; limits.memory is only enforced when limitsMemory is set.
quota:
  cpu: "40"
  memory: 80Gi
  pods: "300"
  pvcs: "20"
  storage: 500Gi
  loadBalancers: "0"
  # -- (extra) limits.memory hard cap ("" = not enforced).
  limitsMemory: ""
  # -- (extra) limits.cpu hard cap ("" = not enforced; the platform does not set CPU limits by default).
  limitsCpu: ""
  # -- (extra) NodePort services are never allowed for tenants.
  nodePorts: "0"
  # -- (extra) Object count limits (count/<resource>).
  objectCounts:
    services: "100"
    configmaps: "300"
    secrets: "300"
    count/jobs.batch: "100"
    count/cronjobs.batch: "20"
  # -- (extra) Storage classes tenants may not use (quota 0 PVCs), e.g. the strict-local DB class.
  deniedStorageClasses: [longhorn-db]
  # -- (extra) PriorityClasses tenants may not use (a scoped quota with pods: 0).
  #    See docs/resilience.md: platform-critical, data-critical, apps-high, apps-default, batch-low.
  deniedPriorityClasses: [platform-critical, data-critical, system-cluster-critical, system-node-critical]
  # -- (extra) Max pods at PriorityClass apps-high (0 = forbidden, "" = unlimited).
  appsHighPods: ""

# -- Default container requests/limits for containers without explicit resources (landing zone only).
limitRange:
  # -- Default CPU *limit*. "" = none (platform policy: no CPU limits, avoids CFS throttling). Caution: a
  #    default limit lower than a container's explicit request makes the pod invalid.
  defaultCpu: ""
  defaultMemory: 512Mi
  defaultRequestCpu: 100m
  defaultRequestMemory: 128Mi
  # -- (extra) Hard per-container maximums.
  maxCpu: "8"
  maxMemory: 16Gi
  # -- (extra) Max PVC size.
  maxStorage: 100Gi

# -- OIDC groups (Keycloak realm group claim, API server --oidc-groups-prefix applied by the platform)
#    bound to the built-in ClusterRoles admin / edit / view in the tenant namespace.
rbac:
  adminGroups: [acme-admins]
  developerGroups: [acme-devs]
  viewerGroups: [acme-viewers]
  # -- (extra) Prefix prepended to every group name (must match the API server --oidc-groups-prefix).
  groupPrefix: "oidc:"
  # -- (extra) Also bind the platform SRE group as admin.
  platformAdminGroups: [platform-sre]
  # -- (extra) Additional read access to Argo Rollouts / Istio CRs for developers (aggregated view is not
  #    enough for rollouts promote/abort). Creates Role "tenant-delivery".
  deliveryRole: true

istio:
  # -- Label the namespace istio-injection=enabled (requires istio-cni because PSA is "restricted").
  injection: true
  # -- PeerAuthentication mode for the namespace: STRICT | PERMISSIVE.
  mtls: STRICT
  # -- (extra) Sidecar resource limiting egress config to the listed hosts (reduces Envoy memory at scale
  #    and prevents accidental cross-tenant calls). "./*" (same namespace) is always included.
  sidecar:
    enabled: true
    egressHosts:
      - "istio-system/*"
      - "istio-egress/*"
      - "data-postgres/*"
      - "data-redis/*"
      - "data-rabbitmq/*"
      - "data-kafka/*"
      - "integration/*"
      - "observability/*"
    # -- (extra) Extra hosts, e.g. "shared-services/*" or "keycloak/*".
    extraEgressHosts: []
    # -- REGISTRY_ONLY blocks traffic to hosts not in the mesh registry (ServiceEntries); ALLOW_ANY permits it.
    outboundTrafficPolicy: REGISTRY_ONLY
  # -- (extra) AuthorizationPolicy: namespace-wide allow-nothing + ALLOW from these namespaces (the tenant
  #    namespace itself is always allowed). Microservice releases add their own, narrower ALLOW policies.
  authorization:
    enabled: true
    allowedNamespaces: [kong, istio-internal]
    # -- Namespaces allowed to GET the metrics paths (Prometheus scraping with Istio certs).
    metricsNamespaces: [monitoring]
    metricsPaths: [/metrics, /stats/prometheus]
    # -- Extra namespaces (e.g. integration for WSO2 MI callbacks).
    extraAllowedNamespaces: [integration]

# -- Kubernetes NetworkPolicies (landing zone only): default deny ingress+egress, then allow
#    DNS, same namespace, ingress from platform namespaces and egress to data/platform namespaces.
networkPolicy:
  enabled: true
  # -- (extra)
  ingressNamespaces: [kong, istio-internal, istio-system, monitoring, observability]
  # -- (extra)
  egressNamespaces: [data-postgres, data-redis, data-rabbitmq, data-kafka, integration, observability, istio-system, istio-egress]
  # -- (extra) Additional egress namespaces (e.g. keycloak, logging for the Elastic APM agent).
  extraEgressNamespaces: []
  # -- (extra) Raw extra egress rules (NetworkPolicyEgressRule), e.g. ipBlock for hybrid on-prem systems.
  extraEgress: []
  # -- (extra) Where kube-dns / CoreDNS runs.
  dns:
    namespace: kube-system
    podSelector: {k8s-app: kube-dns}

# -- Per-tenant data provisioning in the shared data namespaces.
data:
  # -- CloudNativePG: one `Database` CR per entry in data-postgres (cluster pg-main).
  #    Database and owner role are both "<tenant>_<db>" (hyphens -> underscores).
  postgres:
    enabled: true
    # -- Entries are either a string (logical db name, usually = service name) or an object
    #    {name, vaultPath, passwordKey, connectionLimit}. The role password is read from Vault
    #    secret/<vaultPath> (default tenants/<tenant>/<name>) key DB_PASSWORD - the same key the
    #    microservice release of that service reads, so there is a single source of truth.
    databases: [orders, catalog]
    # -- (extra) Namespace / cluster of the CNPG cluster.
    namespace: data-postgres
    cluster: pg-main
    # -- (extra) retain | delete. retain keeps the database when the CR is deleted (decommission safety).
    reclaimPolicy: retain
    # -- (extra) Default per-role connection limit (protects the shared cluster from a noisy tenant).
    connectionLimit: 200
    # -- (extra) How the owner roles are created:
    #    job     - an Argo CD Sync hook Job runs idempotent CREATE/ALTER ROLE with the CNPG superuser, and a
    #              PostSync Job revokes CONNECT/TEMP from PUBLIC on every tenant database (cross-tenant isolation).
    #    managed - roles are declared by the platform team in Cluster pg-main spec.managed.roles; the chart only
    #              renders the password Secrets "<tenant>-<db>-owner" (label cnpg.io/reload) for them.
    roleManagement: job
    roleJob:
      # -- Secret in data-postgres with keys username/password of a superuser (CNPG: enableSuperuserAccess).
      adminSecret: pg-main-superuser
      # -- rw endpoint used by the job (direct, not through PgBouncer).
      host: pg-main-rw.data-postgres.svc.cluster.local
      port: 5432
      sslmode: require
      image:
        registry: harbor.ops.example.local
        repository: ghcr/cloudnative-pg/postgresql
        tag: "17"
      # -- Seconds the PostSync job waits for CNPG to create each database.
      waitSeconds: 300
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
      nodeSelector: {}
      tolerations: []
    # -- (extra) Database CR options.
    encoding: UTF8
    locale: ""

  # -- Redis has no per-tenant server objects; isolation is logical (db index + key prefix, both
  #    published in the endpoints ConfigMap and passed to the tenant's service releases).
  redis:
    db: 1
    keyPrefix: "acme:"

  # -- RabbitMQ messaging-topology-operator objects in data-rabbitmq (cluster reference "rabbitmq").
  rabbitmq:
    enabled: true
    vhost: acme
    # -- (extra)
    namespace: data-rabbitmq
    clusterName: rabbitmq
    # -- (extra) One RabbitMQ user "<tenant>-<service>" per entry, with configure/write/read on the vhost.
    #    Password from Vault tenants/<tenant>/<service> key RABBITMQ_PASSWORD (as consumed by the service).
    users: []
    # -- (extra) Default queue type of the vhost.
    defaultQueueType: quorum
    # -- (extra) Dead-letter topology: exchange "<dlx.exchange>", queue "<dlx.queue>" bound with "#",
    #    plus a Policy applying DLX + delivery-limit to every queue in the vhost.
    dlx:
      enabled: true
      exchange: dlx
      queue: dead-letters
      deliveryLimit: 20
      # -- Max messages kept in the dead-letter queue (overflow drop-head).
      maxLength: 1000000
    # -- (extra) Extra Policy definition keys merged into the default policy (e.g. max-length).
    policyDefinition: {}
    # -- (extra) Vhost limits (noisy neighbour). Requires a messaging-topology-operator version that
    #    supports Vhost.spec.vhostLimits; leave empty to skip.
    vhostLimits: {}
    #  connections: 2000
    #  queues: 500

  # -- Strimzi KafkaTopic / KafkaUser in data-kafka (label strimzi.io/cluster: kafka).
  #    Topic names are always "<tenant>.<name>"; ACLs are restricted to the "<tenant>." prefix.
  kafka:
    enabled: true
    topics:
      - name: orders-events
        partitions: 12
        replicas: 3
    # -- (extra) Strimzi API version. Strimzi >= 1.0 serves only kafka.strimzi.io/v1 (the platform runs
    #    Strimzi 1.x); set kafka.strimzi.io/v1beta2 for Strimzi 0.x.
    apiVersion: kafka.strimzi.io/v1
    namespace: data-kafka
    clusterName: kafka
    # -- (extra) Default topic config (merged under each topic's `config`).
    topicConfig:
      min.insync.replicas: "2"
      retention.ms: "604800000"
      cleanup.policy: delete
      compression.type: producer
    # -- (extra) One KafkaUser "<tenant>-<service>" per entry. Password (SCRAM-SHA-512) from Vault
    #    tenants/<tenant>/<service> key KAFKA_PASSWORD. ACLs: topics/groups/transactionalIds with prefix "<tenant>.".
    users: []
    authentication: scram-sha-512
    # -- (extra) Per-user quotas (noisy-neighbour protection on the shared brokers).
    quotas:
      producerByteRate: 10485760
      consumerByteRate: 20971520
      requestPercentage: 25
      controllerMutationRate: 10

# -- Vault-backed secrets for the tenant (landing zone only for the SecretStore).
externalSecrets:
  enabled: true
  # -- (extra) external-secrets.io API version (ESO >= 0.17 serves v1).
  apiVersion: external-secrets.io/v1
  # -- (extra) Namespaced SecretStore "vault-tenant": Vault Kubernetes auth role "tenant-<name>", whose Vault
  #    policy only grants secret/data/tenants/<name>/*. Stronger isolation than the ClusterSecretStore.
  secretStore:
    enabled: true
    name: vault-tenant
    server: http://vault.vault.svc.cluster.local:8200
    mountPath: kubernetes
    # -- Vault role; default tenant-<name>.
    role: ""
    serviceAccount: vault-tenant-auth
    # -- Optional CA bundle for https Vault ({type: ConfigMap|Secret, name, key, namespace}).
    caProvider: {}
  # -- (extra) ClusterSecretStore used for objects the chart renders in the data namespaces (and for the
  #    tenant ExternalSecrets when secretStore.enabled=false). KV v2 mount "secret".
  clusterSecretStore: vault-backend
  refreshInterval: 1h
  # -- (extra) ExternalSecrets created in the tenant namespace; each extracts all keys of
  #    secret/tenants/<tenant>/<path> into Secret <name>.
  secrets:
    - name: tenant-common-secrets
      path: common

# -- (extra) Kong consumer for the tenant: the Kong jwt plugin (key_claim_name: iss) maps the Keycloak
#    realm issuer to this consumer, so rate limits with limit_by=consumer become per-tenant limits.
kong:
  consumer:
    enabled: true
    ingressClass: kong
    # -- Aggregate per-tenant rate limit (rate-limiting plugin on the consumer, limit_by consumer).
    #    Kong plugin precedence: a consumer-scoped plugin wins over the route-scoped rate-limiting plugin of
    #    a release, so for an identified tenant this is the effective limit across all its routes. 0 = unset.
    rateLimit:
      enabled: true
      second: 0
      minute: 30000
      hour: 1000000
      # -- local | cluster | redis (redis = counters shared by all Kong replicas).
      policy: redis
      redis:
        host: redis.data-redis.svc.cluster.local
        port: 6379
        database: 0
        # -- Secret in the tenant namespace holding the Redis password (KIC configPatches). Empty = none.
        passwordSecret: {name: "", key: ""}
    # -- JWT credential: key = realm issuer, RS256 public key from Vault tenants/<tenant>/keycloak key
    #    realm_public_key (PEM). Rendered as a Secret labelled konghq.com/credential=jwt via ExternalSecret.
    jwtCredential:
      enabled: true
      vaultPath: ""
      publicKeyProperty: realm_public_key

# -- Keycloak realm hint (annotations + endpoints ConfigMap). One realm per tenant.
keycloak:
  realm: acme
  # -- (extra) Public issuer base (issuer = <issuerBase>/realms/<realm>).
  issuerBase: https://keycloak.example.com

# -- (extra) Well-known in-cluster endpoints (docs/conventions.md), published in ConfigMap
#    "tenant-platform-endpoints" (pooled tenants: "tenant-<name>-platform-endpoints").
endpoints:
  postgres:
    pooler: pg-main-pooler-rw.data-postgres.svc.cluster.local
    rw: pg-main-rw.data-postgres.svc.cluster.local
    ro: pg-main-ro.data-postgres.svc.cluster.local
    port: "5432"
  redis:
    host: redis.data-redis.svc.cluster.local
    port: "6379"
    sentinel: redis-sentinel.data-redis.svc.cluster.local:26379
    sentinelMaster: mymaster
  rabbitmq:
    host: rabbitmq.data-rabbitmq.svc.cluster.local
    port: "5672"
    managementPort: "15672"
  kafka:
    bootstrap: kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9092
    bootstrapTls: kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9093
    bridge: http://kafka-bridge-bridge-service.data-kafka.svc.cluster.local:8080
  microIntegrator:
    http: http://micro-integrator.integration.svc.cluster.local:8290
    https: https://micro-integrator.integration.svc.cluster.local:8253
  otel:
    grpc: http://otel-collector.observability.svc.cluster.local:4317
    http: http://otel-collector.observability.svc.cluster.local:4318
  elasticsearch: http://elasticsearch-es-http.logging.svc.cluster.local:9200
  apm: http://apm-server-apm-http.logging.svc.cluster.local:8200
  prometheus: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  keycloak: http://keycloak.keycloak.svc.cluster.local:8080
  vault: http://vault.vault.svc.cluster.local:8200
  # -- Public API hosts. Default: <tenant>.api.example.com (dedicated) / api.example.com (shared).
  apiHost: ""
  appHost: ""
  domain: example.com
  # -- Extra keys appended to the ConfigMap.
  extra: {}
