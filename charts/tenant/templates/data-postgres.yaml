{{- if .Values.data.postgres.enabled }}
{{- $pg := .Values.data.postgres }}
{{- $name := include "tenant.name" . }}
{{- $dbs := (include "tenant.postgresDatabases" . | fromYaml).items }}
{{- range $dbs }}
---
# Owner-role password for {{ .role }} - same Vault key the {{ .name }} release reads as DB_PASSWORD.
apiVersion: {{ $.Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .crName }}-owner
  namespace: {{ $pg.namespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .crName }}-owner
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
          platform.example.com/tenant: {{ $name }}
      data:
        username: {{ .role | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .vaultPath }}
        property: {{ .passwordKey }}
---
# CloudNativePG declarative database (owner role created by the pg-roles job or by Cluster managed roles).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .crName }}
  namespace: {{ $pg.namespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  cluster:
    name: {{ $pg.cluster }}
  name: {{ .db }}
  owner: {{ .role }}
  ensure: present
  databaseReclaimPolicy: {{ $pg.reclaimPolicy }}
  {{- with $pg.encoding }}
  encoding: {{ . }}
  {{- end }}
  {{- with $pg.locale }}
  locale: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and (eq $pg.roleManagement "job") $dbs }}
{{- $j := $pg.roleJob }}
{{- range $phase := list "roles" "grants" }}
---
{{- /* roles: Sync hook (wave 1) before the Database CRs; grants: PostSync once databases exist. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-{{ $phase }}-{{ $name }}
  namespace: {{ $pg.namespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
  annotations:
    {{- if eq $phase "roles" }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    {{- else }}
    argocd.argoproj.io/hook: PostSync
    {{- end }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: {{ add $j.waitSeconds 600 }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        platform.example.com/tenant: {{ $name }}
        app.kubernetes.io/name: pg-tenant-{{ $phase }}
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      {{- with $j.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $j.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: psql
          image: {{ include "tenant.image" (dict "image" $j.image) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "tenant.containerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $j.resources | nindent 12 }}
          env:
            - {name: HOME, value: /tmp}
            - {name: PGHOST, value: {{ $j.host | quote }}}
            - {name: PGPORT, value: {{ $j.port | quote }}}
            - {name: PGDATABASE, value: postgres}
            - {name: PGSSLMODE, value: {{ $j.sslmode | quote }}}
            - {name: PGCONNECT_TIMEOUT, value: "10"}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: {{ $j.adminSecret }}, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ $j.adminSecret }}, key: password}}
            {{- if eq $phase "roles" }}
            {{- range $i, $d := $dbs }}
            - name: ROLE_PASSWORD_{{ $i }}
              valueFrom: {secretKeyRef: {name: {{ $d.crName }}-owner, key: password}}
            {{- end }}
            {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if eq $phase "roles" }}
              # Idempotent: create the tenant owner roles, then (re)apply attributes + password from Vault.
              {{- range $i, $d := $dbs }}
              echo "ensuring role {{ $d.role }}"
              psql -v ON_ERROR_STOP=1 -v role={{ $d.role }} -v connlimit={{ $d.connectionLimit | int64 }} <<'SQL'
              \getenv pwd ROLE_PASSWORD_{{ $i }}
              SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT %s PASSWORD %L', :'role', :'connlimit', :'pwd') \gexec
              SQL
              {{- end }}
              {{- else }}
              # Cross-tenant isolation: only the owner (and the CNPG pooler auth role) may connect.
              {{- range $d := $dbs }}
              echo "waiting for database {{ $d.db }}"
              n=0
              until [ "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ $d.db }}'")" = "1" ]; do
                n=$((n+5)); [ "$n" -ge {{ $j.waitSeconds }} ] && { echo "database {{ $d.db }} not created by CNPG"; exit 1; }
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 -v db={{ $d.db }} -v role={{ $d.role }} <<'SQL'
              SELECT format('REVOKE CONNECT, TEMPORARY ON DATABASE %I FROM PUBLIC', :'db') \gexec
              SELECT format('GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I', :'db', :'role') \gexec
              SELECT format('GRANT CONNECT ON DATABASE %I TO cnpg_pooler_pgbouncer', :'db') WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cnpg_pooler_pgbouncer') \gexec
              SQL
              {{- end }}
              {{- end }}
              echo done
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
