{{- if .Values.externalSecrets.enabled }}
{{- $ns := include "tenant.namespace" . }}
{{- $name := include "tenant.name" . }}
{{- $es := .Values.externalSecrets }}
{{- $useStore := and (include "tenant.landingZone" .) $es.secretStore.enabled }}
{{- if $useStore }}
# Identity used by ESO to log in to Vault (Kubernetes auth). The Vault role tenant-{{ $name }} is bound to
# this ServiceAccount/namespace and to a policy granting read on secret/data/tenants/{{ $name }}/* only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.secretStore.serviceAccount }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: {{ $es.apiVersion }}
kind: SecretStore
metadata:
  name: {{ $es.secretStore.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $es.secretStore.server | quote }}
      path: secret
      version: v2
      {{- with $es.secretStore.caProvider }}
      caProvider:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ $es.secretStore.mountPath | quote }}
          role: {{ default (printf "tenant-%s" $name) $es.secretStore.role | quote }}
          serviceAccountRef:
            name: {{ $es.secretStore.serviceAccount }}
{{- end }}
{{- range $es.secrets }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "tenant.objectPrefix" $ }}{{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- if $useStore }}
    kind: SecretStore
    name: {{ $es.secretStore.name }}
    {{- else }}
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
    {{- end }}
  target:
    name: {{ include "tenant.objectPrefix" $ }}{{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          platform.example.com/tenant: {{ $name }}
  dataFrom:
    - extract:
        key: {{ printf "tenants/%s/%s" $name (required "externalSecrets.secrets[].path is required" .path) }}
{{- end }}
{{- end }}
