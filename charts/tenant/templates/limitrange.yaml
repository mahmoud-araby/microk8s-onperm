{{- if include "tenant.landingZone" . }}
{{- $l := .Values.limitRange }}
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: {{ include "tenant.namespace" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- if or $l.defaultCpu $l.defaultMemory $l.defaultEphemeralStorage }}
      default:
        {{- with $l.defaultCpu }}
        cpu: {{ . | quote }}
        {{- end }}
        {{- with $l.defaultMemory }}
        memory: {{ . | quote }}
        {{- end }}
        {{- with $l.defaultEphemeralStorage }}
        ephemeral-storage: {{ . | quote }}
        {{- end }}
      {{- end }}
      defaultRequest:
        cpu: {{ $l.defaultRequestCpu | quote }}
        memory: {{ $l.defaultRequestMemory | quote }}
        {{- with $l.defaultRequestEphemeralStorage }}
        ephemeral-storage: {{ . | quote }}
        {{- end }}
      {{- if or $l.maxCpu $l.maxMemory $l.maxEphemeralStorage }}
      max:
        {{- with $l.maxCpu }}
        cpu: {{ . | quote }}
        {{- end }}
        {{- with $l.maxMemory }}
        memory: {{ . | quote }}
        {{- end }}
        {{- with $l.maxEphemeralStorage }}
        ephemeral-storage: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- with $l.maxStorage }}
    - type: PersistentVolumeClaim
      max:
        storage: {{ . | quote }}
    {{- end }}
{{- end }}
