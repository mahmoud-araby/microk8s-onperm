apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-runtime-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  config.js: |
    // Generated by charts/frontend from .Values.runtimeConfig - do not edit in the image.
    window.__CONFIG__ = Object.freeze({{ include "frontend.runtimeConfig" . }});
