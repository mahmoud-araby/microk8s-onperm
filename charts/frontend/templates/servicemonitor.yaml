{{- if .Values.serviceMonitor.enabled }}
{{- $sm := .Values.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
      platform.example.com/metrics: "true"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  podTargetLabels: [version, role, platform.example.com/tenant]
  endpoints:
    - port: metrics
      path: {{ $sm.path }}
      interval: {{ $sm.interval }}
      {{- if $sm.istioMtls }}
      scheme: https
      tlsConfig:
        caFile: /etc/prom-certs/root-cert.pem
        certFile: /etc/prom-certs/cert-chain.pem
        keyFile: /etc/prom-certs/key.pem
        insecureSkipVerify: true
      {{- else }}
      scheme: http
      {{- end }}
      relabelings:
        - targetLabel: tenant
          replacement: {{ include "frontend.tenant" . | quote }}
{{- end }}
