{{- if .Values.rollout.enabled }}
# Canary Service: Argo Rollouts injects rollouts-pod-template-hash into the selector of this
# Service (canary ReplicaSet) and of the stable Service (stable ReplicaSet).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservice.canaryName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
    role: canary
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "microservice.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
