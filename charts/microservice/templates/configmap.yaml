apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservice.configName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
{{- if .Values.config }}
data:
  {{- range $k, $val := .Values.config }}
  {{ $k }}: {{ tpl (toString $val) $ | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
