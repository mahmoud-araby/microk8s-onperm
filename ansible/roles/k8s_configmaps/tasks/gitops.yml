---
# Output directory = plain `directory` source of the tenant Application (gitops/apps/applicationsets/
# tenants.yaml). Rules agreed with gitops/: file names "generated-<configmap>.yaml", no namespace in
# the manifests (the Application destination decides), no kustomization.yaml (it would turn the source
# into a Kustomize app and drop hand-written files), and hand-written files such as
# tenant-feature-flags.yaml are never written or pruned.
- name: Resolve the GitOps output directory
  ansible.builtin.set_fact:
    _k8s_cm_out_dir: "{{ (k8s_configmaps_gitops_root ~ '/tenants/' ~ _k8s_cm_tenant.gitopsDir ~ '/' ~ k8s_configmaps_gitops_dir_name) | realpath }}"
    _k8s_cm_out_files: >-
      {{ _k8s_cm_objects | map(attribute='metadata.name')
         | map('regex_replace', '^', k8s_configmaps_gitops_file_prefix)
         | map('regex_replace', '$', '.yaml') | list }}

- name: Require a file prefix so hand-written manifests can never be overwritten or pruned
  ansible.builtin.assert:
    that: k8s_configmaps_gitops_file_prefix | length > 0
    fail_msg: k8s_configmaps_gitops_file_prefix must not be empty
    quiet: true

- name: Create the output directory
  ansible.builtin.file:
    path: "{{ _k8s_cm_out_dir }}"
    state: directory
    mode: "0755"

- name: Write ConfigMap manifests
  ansible.builtin.copy:
    dest: "{{ _k8s_cm_out_dir }}/{{ k8s_configmaps_gitops_file_prefix }}{{ _cm.metadata.name }}.yaml"
    content: |
      # Generated by ansible/playbooks/configmaps.yml (role k8s_configmaps) - DO NOT EDIT BY HAND.
      # Sources: ansible/configmaps/tenants/{{ _k8s_cm_tenant_file | basename }}, ansible/configmaps/services/,
      #          ansible/inventories/{{ k8s_configmaps_environment_name }}/group_vars/all/configmaps.yml
      # Synced by Argo CD Application tenant-{{ _k8s_cm_tenant.name }} into namespace {{ _k8s_cm_tenant.namespace }}.
      {{ _cm | combine({'metadata': _cm.metadata | dict2items | rejectattr('key', 'equalto', 'namespace') | items2dict}) | to_k8s_yaml }}
    mode: "0644"
  loop: "{{ _k8s_cm_objects }}"
  loop_control:
    loop_var: _cm
    label: "{{ k8s_configmaps_gitops_file_prefix }}{{ _cm.metadata.name }}.yaml"

- name: Find previously generated manifests
  ansible.builtin.find:
    paths: "{{ _k8s_cm_out_dir }}"
    patterns: ["{{ k8s_configmaps_gitops_file_prefix }}*.yaml"]
  register: _k8s_cm_existing_files
  when: k8s_configmaps_prune | bool

- name: Prune generated manifests that are no longer produced
  ansible.builtin.file:
    path: "{{ _stale }}"
    state: absent
  loop: >-
    {{ _k8s_cm_existing_files.files | default([]) | map(attribute='path')
       | reject('in', _k8s_cm_out_files | map('regex_replace', '^', _k8s_cm_out_dir ~ '/') | list)
       | list }}
  loop_control:
    loop_var: _stale
  when: k8s_configmaps_prune | bool
