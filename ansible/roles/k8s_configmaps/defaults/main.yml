---
# ===========================================================================
# role: k8s_configmaps - "ConfigMap Ansible"
#
# Renders application configuration files (appsettings.json, application.yaml, .env,
# config.js ...) from Jinja2 templates and LAYERED variables, wraps them in Kubernetes
# ConfigMaps and either applies them (mode=apply) or writes them into the GitOps tree
# (mode=gitops) under gitops/tenants/<tenant>/configmaps/.
#
# Layers (deep-merged, later wins, lists are replaced):
#   1. global       k8s_configmaps_global                    (this file)
#   2. environment  k8s_configmaps_environment               (inventories/<env>/group_vars/all/configmaps.yml)
#   3. tenant       <tenants_dir>/<tenant>.yml: config + environments.<env>
#   4. service      <services_dir>/<service>.yml: config + environments.<env>   (catalogue defaults)
#                   then the tenant file's services[].config + services[].environments.<env>
#
# NEVER put secrets here: passwords/tokens come from Vault via External Secrets
# (Secret "<fullname>-secrets", envFrom). The role fails if a secret-looking key has
# a literal value; use placeholders such as "${DB_PASSWORD}" instead.
# ===========================================================================

# apply | gitops
k8s_configmaps_mode: gitops
kubeconfig_path: "{{ inventory_dir }}/.kubeconfig"
k8s_configmaps_environment_name: "{{ platform_environment | default('production') }}"

# Where tenant / service definitions live (controller paths)
k8s_configmaps_root: "{{ playbook_dir }}/../configmaps"
k8s_configmaps_tenants_dir: "{{ k8s_configmaps_root }}/tenants"
k8s_configmaps_services_dir: "{{ k8s_configmaps_root }}/services"
# Restrict a run: -e k8s_configmaps_only_tenants=[acme] -e k8s_configmaps_only_services=[orders]
k8s_configmaps_only_tenants: []
k8s_configmaps_only_services: []

# --- gitops mode ------------------------------------------------------------------------
k8s_configmaps_gitops_root: "{{ playbook_dir }}/../../gitops"
# Output: <gitops_root>/tenants/<tenant.gitopsDir>/<k8s_configmaps_gitops_dir_name>/generated-<name>.yaml
# That directory is a plain `directory` source of the tenant Application (gitops/apps/applicationsets/
# tenants.yaml): NO kustomization.yaml is written, manifests carry no namespace (the Application's
# destination decides), and hand-written files (e.g. tenant-feature-flags.yaml) are never touched -
# only files matching <k8s_configmaps_gitops_file_prefix>*.yaml are written or pruned.
k8s_configmaps_gitops_dir_name: configmaps
k8s_configmaps_gitops_file_prefix: generated-
# Remove previously generated files that are no longer produced
k8s_configmaps_prune: true
# Commit the generated files (CI usually does this instead; never pushes)
k8s_configmaps_git_commit: false
k8s_configmaps_git_commit_message: "chore(configmaps): render {{ k8s_configmaps_environment_name }} ConfigMaps [ansible]"
# Argo CD sync wave inside the tenant Application (same wave as tenant-feature-flags.yaml)
k8s_configmaps_sync_wave: "5"

# --- apply mode -------------------------------------------------------------------------
# Patch Deployments / Rollouts of the service (labels app.kubernetes.io/name + version)
# with the ConfigMap checksum so pods roll when their configuration changes.
k8s_configmaps_restart_workloads: true
k8s_configmaps_checksum_annotation: platform.example.com/config-checksum
# Fail when the target namespace does not exist (namespaces belong to charts/tenant)
k8s_configmaps_require_namespace: true

# --- Safety -----------------------------------------------------------------------------
k8s_configmaps_fail_on_secrets: true
k8s_configmaps_secret_key_patterns:
  - "(password|passwd|pwd|secret|token|apikey|privatekey|credentials?|connectionstring)$"

# --- Naming -----------------------------------------------------------------------------
# ConfigMap = <objectPrefix><fullname>-<suffix>
#   fullname: charts/microservice <service>-<version> (e.g. orders-v1);
#             charts/frontend <name> (pool) or <name>-<tenant> (dedicated), e.g. web-acme
#   suffix "files": the charts already own "<fullname>-config" (microservice envFrom) and
#             "<fullname>-runtime-config" / "<fullname>-nginx" (frontend). Mount the generated
#             ConfigMap through the charts' extraVolumes / extraVolumeMounts.
#   objectPrefix: "tenant-<name>-" for POOLED tenants (tier shared, not the pool itself) whose
#             objects live in shared-services; "" otherwise (same rule as charts/tenant).
k8s_configmaps_service_suffix: files
k8s_configmaps_frontend_suffix: files
k8s_configmaps_labels_common:
  app.kubernetes.io/managed-by: ansible
  app.kubernetes.io/component: config
  platform.example.com/generated-by: k8s-configmaps

# --- Templates per language (key = file name inside the ConfigMap) ----------------------
# Override per service with `templates: [{template: path.j2, key: file.name}]`.
k8s_configmaps_language_templates:
  dotnet:
    - template: dotnet/appsettings.json.j2
      key: "appsettings.{{ k8s_configmaps_environment_name | capitalize }}.json"
  java:
    - template: java/application.yaml.j2
      key: application.yaml
  python:
    - template: python/app.env.j2
      key: .env
    - template: python/settings.json.j2
      key: settings.json
  static:
    - template: frontend/config.js.j2
      key: config.js

# --- Tenant settings ConfigMap ("tenant-settings" / "tenant-<name>-tenant-settings") -----
# Tenant-level merged configuration (layers 1-3) as settings.json + flat env keys; this is what
# pooled services read to resolve per-tenant behaviour (feature flags, CORS, auth issuer ...).
k8s_configmaps_tenant_settings_enabled: true
k8s_configmaps_tenant_settings_name: tenant-settings

# --- Platform endpoints ConfigMap ("platform-endpoints", envFrom-friendly) -------------
# Keys are PLATFORM_<SERVICE>_<FIELD> (e.g. PLATFORM_POSTGRES_HOST, PLATFORM_KAFKA_BOOTSTRAP_SERVERS)
# so they never collide with the standard env vars injected by charts/microservice.
k8s_configmaps_platform_endpoints_enabled: true
k8s_configmaps_platform_endpoints_name: platform-endpoints
k8s_configmaps_platform_endpoints_prefix: PLATFORM

# Well-known in-cluster endpoints (docs/conventions.md) - single source for all templates.
k8s_configmaps_endpoints:
  postgres:
    host: pg-main-pooler-rw.data-postgres.svc.cluster.local     # rw via PgBouncer (default)
    port: 5432
    rwHost: pg-main-rw.data-postgres.svc.cluster.local           # rw direct
    roHost: pg-main-ro.data-postgres.svc.cluster.local           # read replicas
  redis:
    host: redis.data-redis.svc.cluster.local
    port: 6379
    sentinelHost: redis-sentinel.data-redis.svc.cluster.local
    sentinelPort: 26379
    sentinelMasterSet: mymaster
  rabbitmq:
    host: rabbitmq.data-rabbitmq.svc.cluster.local
    port: 5672
    managementPort: 15672
    managementUrl: http://rabbitmq.data-rabbitmq.svc.cluster.local:15672
  kafka:
    bootstrapServers: kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9092
    bootstrapServersTls: kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9093
    bridgeUrl: http://kafka-bridge-bridge-service.data-kafka.svc.cluster.local:8080
  microIntegrator:
    httpUrl: http://micro-integrator.integration.svc.cluster.local:8290
    httpsUrl: https://micro-integrator.integration.svc.cluster.local:8253
  otel:
    grpcEndpoint: http://otel-collector.observability.svc.cluster.local:4317
    httpEndpoint: http://otel-collector.observability.svc.cluster.local:4318
  elasticsearch:
    url: https://elasticsearch-es-http.logging.svc.cluster.local:9200
  apm:
    url: https://apm-server-apm-http.logging.svc.cluster.local:8200
  prometheus:
    url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  keycloak:
    internalUrl: http://keycloak.keycloak.svc.cluster.local:8080
    publicUrl: "https://keycloak.{{ platform_domain | default('example.com') }}"
  vault:
    addr: http://vault.vault.svc.cluster.local:8200
  api:
    publicUrl: "https://api.{{ platform_domain | default('example.com') }}"

# --- Layer 1: GLOBAL defaults (language-neutral configuration model) --------------------
k8s_configmaps_global:
  environment: "{{ k8s_configmaps_environment_name }}"
  tenantId: ""
  logging:
    level: info              # trace | debug | info | warn | error (mapped per language)
    format: json
  http:
    port: 8080
    timeoutSeconds: 10
    retries: 2
    shutdownTimeoutSeconds: 25
    corsAllowedOrigins: []
  database:
    enabled: false
    host: "{{ k8s_configmaps_endpoints.postgres.host }}"
    port: "{{ k8s_configmaps_endpoints.postgres.port }}"
    readHost: "{{ k8s_configmaps_endpoints.postgres.roHost }}"
    name: ""
    # charts/tenant creates databases "<tenant>_<name>" (hyphens -> underscores); set per tenant
    namePrefix: ""
    sslMode: require
    poolMin: 5
    poolMax: 50
    commandTimeoutSeconds: 30
    # credentials: env DB_USER / DB_PASSWORD from the Vault-backed Secret
  redis:
    enabled: false
    host: "{{ k8s_configmaps_endpoints.redis.host }}"
    port: "{{ k8s_configmaps_endpoints.redis.port }}"
    db: 0
    # effective prefix = keyPrefix + "<service>:" (ApplicationSet contract "<tenant>:<service>:")
    keyPrefix: ""
    useSentinel: false
    sentinelHost: "{{ k8s_configmaps_endpoints.redis.sentinelHost }}"
    sentinelPort: "{{ k8s_configmaps_endpoints.redis.sentinelPort }}"
    sentinelMasterSet: "{{ k8s_configmaps_endpoints.redis.sentinelMasterSet }}"
  rabbitmq:
    enabled: false
    host: "{{ k8s_configmaps_endpoints.rabbitmq.host }}"
    port: "{{ k8s_configmaps_endpoints.rabbitmq.port }}"
    vhost: /
    prefetch: 50
  kafka:
    enabled: false
    bootstrapServers: "{{ k8s_configmaps_endpoints.kafka.bootstrapServers }}"
    securityProtocol: PLAINTEXT
    topicPrefix: ""
    consumerGroup: ""
    topics: {}
  otel:
    endpoint: "{{ k8s_configmaps_endpoints.otel.grpcEndpoint }}"
    protocol: grpc
    tracesSamplerRatio: 0.1
  auth:
    enabled: true
    issuer: ""
    audience: api
    tenantClaim: tenant
  features: {}
  # SPA runtime config (charts/frontend runtimeConfig). apiBaseUrl / authUrl default per
  # tenant: dedicated -> https://<tenant>.api.<domain>, shared -> https://api.<domain>.
  frontend:
    apiBaseUrl: ""
    authUrl: ""
    authClientId: ""
    telemetry:
      enabled: false
  # Free-form, merged verbatim into the language-specific document (last)
  custom: {}
