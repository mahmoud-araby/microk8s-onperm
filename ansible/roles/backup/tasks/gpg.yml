---
- name: Check the GPG public key file on the controller
  ansible.builtin.stat:
    path: "{{ backup_gpg_public_key_file }}"
  delegate_to: localhost
  become: false
  register: _backup_gpg_pub

- name: Require the GPG public key when encryption is configured
  ansible.builtin.assert:
    that: _backup_gpg_pub.stat.exists
    fail_msg: >-
      backup_gpg_recipient is set but {{ backup_gpg_public_key_file }} does not exist.
      Export it with: gpg --armor --export {{ backup_gpg_recipient }} > {{ backup_gpg_public_key_file }}
    quiet: true

- name: Copy the backup GPG public key
  ansible.builtin.copy:
    src: "{{ backup_gpg_public_key_file }}"
    dest: /root/.microk8s-backup.pub.asc
    owner: root
    group: root
    mode: "0600"
  register: _backup_gpg_key

- name: Import the backup GPG public key  # noqa: no-handler - must run before the recipient check below
  ansible.builtin.command: gpg --batch --import /root/.microk8s-backup.pub.asc
  when: _backup_gpg_key is changed
  changed_when: true

- name: Check the recipient key is usable
  ansible.builtin.command: gpg --batch --list-keys {{ backup_gpg_recipient | quote }}
  changed_when: false
