---
- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, jq, chrony, ufw, logrotate]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Enable chrony (raft and TLS need a synchronised clock)
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Download the HashiCorp apt signing key
  ansible.builtin.get_url:
    url: "{{ vault_server_apt_key_url }}"
    dest: "{{ vault_server_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the HashiCorp apt repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: ["{{ vault_server_apt_repo_url }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "{{ vault_server_apt_keyring }}"
    state: present
  register: _vault_server_repo

- name: Install the pinned Vault version
  ansible.builtin.apt:
    name: "{{ vault_server_package }}={{ vault_server_version }}-*"
    state: present
    update_cache: "{{ _vault_server_repo is changed }}"
    allow_change_held_packages: true
    lock_timeout: 300
  notify: Restart vault

- name: Hold the Vault package (upgrades only through vault_server_version)
  ansible.builtin.dpkg_selections:
    name: "{{ vault_server_package }}"
    selection: "{{ 'hold' if vault_server_hold_package | bool else 'install' }}"

- name: Ensure the vault system user exists (normally created by the package)
  ansible.builtin.user:
    name: "{{ vault_server_user }}"
    group: "{{ vault_server_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /opt/vault
    create_home: false

- name: Disable swap (Vault keeps secrets in memory; mlock is off with raft)
  when: vault_server_disable_swap | bool
  block:
    - name: Turn off active swap
      ansible.builtin.command: swapoff -a
      when: (ansible_facts['swaptotal_mb'] | int) > 0
      changed_when: true

    - name: Comment out swap entries in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
        replace: '# \1  # disabled by ansible (vault_server)'
