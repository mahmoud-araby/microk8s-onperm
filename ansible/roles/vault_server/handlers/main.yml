---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# A restart SEALS this node (Shamir). The role unseals it right after flush_handlers when the keys
# are available; the play runs serial: 1 so quorum is never lost.
- name: Restart vault
  ansible.builtin.systemd_service:
    name: vault
    state: restarted
    daemon_reload: true

# SIGHUP: reloads TLS certificates, log level and re-opens the file audit device (no reseal).
- name: Reload vault
  ansible.builtin.systemd_service:
    name: vault
    state: reloaded
