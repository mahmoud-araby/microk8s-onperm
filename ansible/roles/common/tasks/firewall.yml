---
# Order matters: SSH is allowed BEFORE ufw is enabled so we never lock ourselves out.
- name: Allow SSH from admin networks
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ common_firewall_ssh_port }}"
    proto: tcp
    comment: ssh-admin
  loop: "{{ common_firewall_admin_cidrs }}"

- name: Allow SSH from the cluster networks (node-to-node ansible delegation, backups)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ common_firewall_ssh_port }}"
    proto: tcp
    comment: ssh-cluster
  loop: "{{ common_firewall_cluster_cidrs }}"

- name: Allow Kubernetes API from admin networks
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto }}"
    comment: k8s-admin
  loop: "{{ common_firewall_admin_cidrs | product(common_firewall_admin_ports) | list }}"
  loop_control:
    label: "{{ item.0 }} -> {{ item.1.port }}/{{ item.1.proto }}"

- name: Allow cluster ports between nodes
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto }}"
    comment: microk8s-cluster
  loop: "{{ common_firewall_cluster_cidrs | product(common_firewall_cluster_ports) | list }}"
  loop_control:
    label: "{{ item.0 }} -> {{ item.1.port }}/{{ item.1.proto }}"

- name: Allow public ports (edge pool)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: public
  loop: "{{ common_firewall_public_ports }}"

- name: Allow traffic on CNI interfaces (inbound)
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ item }}"
  loop: "{{ common_firewall_cni_interfaces }}"

- name: Allow traffic on CNI interfaces (outbound)
  community.general.ufw:
    rule: allow
    direction: out
    interface: "{{ item }}"
  loop: "{{ common_firewall_cni_interfaces }}"

- name: Allow routed (forwarded) traffic - required for pod and LoadBalancer traffic
  community.general.ufw:
    default: allow
    direction: routed

- name: Allow outgoing traffic by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Deny incoming traffic by default and enable ufw
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
    logging: "low"
