---
- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart multipathd
  ansible.builtin.systemd_service:
    name: multipathd
    state: restarted

- name: Reexec systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true
