---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    lock_timeout: 300
  when: hardening_unattended_upgrades_enabled | bool

- name: Configure unattended-upgrades (security pocket only)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: hardening_unattended_upgrades_enabled | bool

- name: Enable or disable periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible (role: hardening)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "{{ '1' if hardening_unattended_upgrades_enabled | bool else '0' }}";
    owner: root
    group: root
    mode: "0644"
