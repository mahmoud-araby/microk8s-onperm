---
- name: Look up the connecting user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user | default(lookup('env', 'USER')) }}"
  when: hardening_ssh_require_authorized_keys | bool

- name: Check that the connecting user has authorized_keys
  ansible.builtin.stat:
    path: "{{ ansible_facts['getent_passwd'][ansible_user | default(lookup('env', 'USER'))][4] }}/.ssh/authorized_keys"
  register: _hardening_authorized_keys
  when: hardening_ssh_require_authorized_keys | bool

- name: Refuse to disable password logins without key-based access
  ansible.builtin.assert:
    that:
      - _hardening_authorized_keys.stat.exists
      - _hardening_authorized_keys.stat.size > 0
    fail_msg: >-
      {{ ansible_user }} has no ~/.ssh/authorized_keys on {{ inventory_hostname }};
      disabling password authentication would lock you out.
    quiet: true
  when:
    - hardening_ssh_require_authorized_keys | bool
    - not (hardening_ssh_password_authentication | bool)

- name: Install login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ hardening_login_banner }}"
    owner: root
    group: root
    mode: "0644"

- name: Install sshd hardening drop-in (validated before it is written)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-platform-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Make sure sshd includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
