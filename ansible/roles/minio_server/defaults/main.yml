---
# ===========================================================================
# role: minio_server - external distributed MinIO on VMs (inventory group `minio_servers`,
# 4 nodes x N drives, erasure coding) = backup target OUTSIDE the Kubernetes failure domain
# (docs/conventions.md "Object storage (MinIO)"): CNPG, Velero, Thanos, ES snapshots, Longhorn,
# dqlite, Harbor. Endpoint: https://minio.storage.example.local:9000
#
# LICENSING / DISTRIBUTION: check MinIO's current licensing and distribution model before using this in
# production. The community edition (AGPLv3) is in maintenance mode and source-only since late 2025: the
# dl.min.io archive binaries are gone (410) and the container images are no longer public. AIStor is the
# commercial edition. This role therefore BUILDS minio/mc from the pinned git tags by default
# (minio_server_binary_source: build) or downloads them from an internal mirror with a pinned sha256 (url).
# S3-compatible alternatives: Ceph RGW, SeaweedFS, Garage - consumers only see the endpoint
# (minio_server_endpoint) and per-bucket credentials, so the backend can be swapped.
#
# Drives are formatted (XFS) and mounted at /mnt/disk{1..N} by role storage_prep (`minio_drives`).
# ===========================================================================

# --- Binaries (PINNED) -----------------------------------------------------------------------------
#   build  go build of the git tag on minio_server_build_host (default: the controller; needs git + Go
#          matching the tag's go.mod), CGO disabled, one binary per node architecture, cached under
#          minio_server_artifact_dir; the sha256 is printed and the copy to the nodes is checksum-verified.
#   url    download from an internal mirror (Harbor/Nexus/Artifactory raw repository) - sha256 REQUIRED.
minio_server_binary_source: build
minio_server_release: RELEASE.2025-10-15T17-29-55Z        # last community tag (source-only)
minio_server_mc_release: RELEASE.2025-08-13T08-35-41Z
minio_server_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
minio_server_bin_dir: /usr/local/bin
# build
minio_server_git_url: https://github.com/minio/minio.git
minio_server_mc_git_url: https://github.com/minio/mc.git
minio_server_build_host: localhost
minio_server_build_dir: /var/tmp/minio-build                # on the build host
minio_server_go_bin: go
minio_server_artifact_dir: "{{ playbook_dir }}/../.cache/minio-artifacts"   # controller, git-ignored (.cache/)
# url (e.g. https://nexus.ops.example.local/repository/raw/minio/minio.RELEASE.2025-10-15T17-29-55Z.linux-amd64)
minio_server_binary_url: ""
minio_server_sha256: ""
minio_server_mc_url: ""
minio_server_mc_sha256: ""

# --- Service account / paths -----------------------------------------------------------------------
minio_server_user: minio-user
minio_server_group: minio-user
minio_server_config_file: /etc/default/minio
minio_server_certs_dir: /etc/minio/certs
minio_server_port: 9000
minio_server_console_port: 9001

# --- Topology ---------------------------------------------------------------------------------------
# Node names used in MINIO_VOLUMES: minio-1.storage.example.local ... minio-N (index in the group).
# The role writes them to /etc/hosts on every MinIO node (DNS should have them too).
minio_server_domain: "storage.{{ platform_internal_domain | default('example.local') }}"
minio_server_host_prefix: minio-
minio_server_node_index: "{{ groups['minio_servers'].index(inventory_hostname) + 1 }}"
minio_server_node_fqdn: "{{ minio_server_host_prefix }}{{ minio_server_node_index }}.{{ minio_server_domain }}"
minio_server_manage_etc_hosts: true
# Drives: `minio_drives` (host/group var, device list, prepared by storage_prep) -> /mnt/disk1..N
minio_server_drive_mount_prefix: /mnt/disk
minio_server_drive_subdir: minio
# 4 nodes x 4 drives -> https://minio-{1...4}.storage.example.local:9000/mnt/disk{1...4}/minio
# (single node: /mnt/disk{1...N}/minio; single node + single drive: /mnt/disk1/minio). Override freely.
minio_server_volumes: >-
  {%- set _n = groups['minio_servers'] | length -%}
  {%- set _d = minio_drives | default([]) | length -%}
  {%- set _drv = minio_server_drive_mount_prefix ~ (('{1...' ~ _d ~ '}') if _d > 1 else '1') ~ '/' ~ minio_server_drive_subdir -%}
  {%- if _n > 1 -%}
  https://{{ minio_server_host_prefix }}{1...{{ _n }}}.{{ minio_server_domain }}:{{ minio_server_port }}{{ _drv }}
  {%- else -%}
  {{ _drv }}
  {%- endif -%}

# Round-robin DNS name (or VIP on the `loadbalancers` HAProxy pair) for the whole pool - clients use it
minio_server_endpoint_host: "minio.{{ minio_server_domain }}"
minio_server_endpoint: "https://{{ minio_server_endpoint_host }}:{{ minio_server_port }}"
minio_server_region: us-east-1               # consumers (Thanos, Velero, ...) are configured with us-east-1
# Erasure-coding parity of the STANDARD storage class (empty = MinIO default, EC:4 for 16 drives)
minio_server_storage_class_standard: ""
minio_server_extra_env: {}

# --- Root credentials (secret: vault_minio_external_root_* via group_vars/all/secrets.yml) --------
minio_server_root_user: "{{ vault_minio_external_root_user | default('') }}"
minio_server_root_password: "{{ vault_minio_external_root_password | default('') }}"

# --- TLS (role pki_cert) ----------------------------------------------------------------------------
minio_server_tls_mode: internal_ca           # internal_ca | files
minio_server_tls_src_cert: ""
minio_server_tls_src_key: ""
minio_server_tls_src_ca: ""
minio_server_tls_extra_sans: []

# --- Metrics ----------------------------------------------------------------------------------------
# public = /minio/v2/metrics/* without auth (internal network only); jwt = bearer token
# (generated with `mc admin prometheus generate` and pushed like the S3 credentials, see below).
minio_server_prometheus_auth_type: jwt
minio_server_prometheus_secret_path: platform/minio-external-metrics

# --- Firewall (ufw) ---------------------------------------------------------------------------------
minio_server_firewall_enabled: true
minio_server_firewall_admin_cidrs: "{{ platform_admin_cidrs | default([]) }}"
minio_server_firewall_client_cidrs: "{{ (platform_node_cidrs | default([])) + (platform_admin_cidrs | default([])) }}"
minio_server_firewall_ssh_port: "22"

# --- Post-install (mc, run once on the first node) --------------------------------------------------
minio_server_configure: true
minio_server_mc_alias: ext
# Buckets use the names the GitOps consumers ALREADY reference (gitops/platform/**); see
# ansible/README.md "External MinIO" for the mapping to the platform-* convention.
#   versioning  - keep overwritten/deleted objects (noncurrent_expire_days cleans them up)
#   object_lock - WORM default retention (GOVERNANCE/COMPLIANCE); only possible at bucket creation
#                 and only for consumers that never rewrite objects in place
#   expire_days - ILM expiry of current objects (0 = none; consumers with their own retention use 0)
minio_server_buckets:
  - name: pg-backups                  # CNPG barman-cloud (gitops/platform/data/postgres, s3://pg-backups/site-a/)
    consumer: postgres-backup
    versioning: true
    object_lock: {mode: GOVERNANCE, days: 30}
    expire_days: 0
    noncurrent_expire_days: 35
  - name: velero-backups              # Velero (gitops/platform/core/velero)
    consumer: velero
    versioning: true
    # No object lock: the Velero BSL sets checksumAlgorithm: "" and object-lock PUTs need a checksum/Content-MD5
    object_lock: {}
    expire_days: 0
    noncurrent_expire_days: 30
  - name: thanos-metrics              # Thanos (compactor rewrites/deletes blocks -> no versioning / lock)
    consumer: thanos
    versioning: false
    object_lock: {}
    expire_days: 0
    noncurrent_expire_days: 0
  - name: es-snapshots                # Elasticsearch SLM (gitops/platform/observability/elastic)
    consumer: elastic-snapshots
    versioning: true
    object_lock: {}
    expire_days: 0
    noncurrent_expire_days: 7
  - name: longhorn-backups            # Longhorn backup target (gitops/platform/core/longhorn)
    consumer: longhorn
    versioning: true
    object_lock: {}
    expire_days: 0
    noncurrent_expire_days: 14
  - name: platform-dqlite             # MicroK8s dqlite / PKI archives (no GitOps consumer yet; role backup uses rsync)
    consumer: dqlite
    versioning: true
    object_lock: {mode: GOVERNANCE, days: 7}
    expire_days: 30
    noncurrent_expire_days: 7
  - name: harbor-registry             # Harbor registry storage (commented s3 block in gitops/platform/core/harbor)
    consumer: harbor
    versioning: false
    object_lock: {}
    expire_days: 0
    noncurrent_expire_days: 0

# One MinIO user + least-privilege policy per consumer (only its own bucket).
# Credentials go to Vault KV v2 <path> with the key names the consumer's ExternalSecret reads.
# `extra` keys are added to the same secret (endpoint / CA for consumers that need them).
minio_server_consumers:
  - name: postgres-backup
    vault_path: platform/postgres-backup
    access_key_field: ACCESS_KEY_ID
    secret_key_field: ACCESS_SECRET_KEY
    extra: {ca.crt: __CA__}
  - name: velero
    vault_path: platform/velero
    access_key_field: s3-access-key
    secret_key_field: s3-secret-key
    extra: {}
  - name: thanos
    vault_path: platform/thanos
    access_key_field: access-key
    secret_key_field: secret-key
    extra: {}
  - name: elastic-snapshots
    vault_path: platform/elastic-snapshots
    access_key_field: access-key
    secret_key_field: secret-key
    extra: {}
  - name: longhorn
    vault_path: platform/longhorn
    access_key_field: s3-access-key
    secret_key_field: s3-secret-key
    extra: {s3-endpoint: __ENDPOINT__, s3-ca-cert: __CA__}
  - name: dqlite
    vault_path: platform/dqlite-s3
    access_key_field: ACCESS_KEY_ID
    secret_key_field: ACCESS_SECRET_KEY
    extra: {endpoint: __ENDPOINT__}
  - name: harbor
    vault_path: platform/harbor-s3
    access_key_field: ACCESS_KEY_ID
    secret_key_field: ACCESS_SECRET_KEY
    extra: {endpoint: __ENDPOINT__}

# Where generated credentials go:
#   hashicorp_vault -> community.hashi_vault.vault_kv2_write (merge into the existing secret)
#   ansible_vault   -> minio_server_credentials_file on the controller, ansible-vault encrypted
minio_server_credentials_backend: "{{ secrets_backend | default('ansible_vault') }}"
minio_server_credentials_file: "{{ inventory_dir }}/minio-external-credentials-{{ platform_environment | default('env') }}.yml"
minio_server_credentials_vault_id: "{{ platform_environment | default('default') }}"
# Vault that receives the credentials. It must be the Vault the ExternalSecrets read from: the external
# Vault when ESO uses it (vault_deployment_mode: both), otherwise the in-cluster Vault through the internal
# gateway (https://vault.ops.example.local) with an AppRole allowed to write secret/platform/*.
minio_server_credentials_vault_url: "{{ secrets_hashi_vault_url | default('https://vault-ext.example.local:8200') }}"
minio_server_credentials_vault_mount: "{{ secrets_hashi_vault_mount | default('secret') }}"
minio_server_credentials_vault_auth_method: "{{ secrets_hashi_vault_auth_method | default('approle') }}"
minio_server_credentials_vault_role_id: "{{ secrets_hashi_vault_role_id | default('') }}"
minio_server_credentials_vault_secret_id: "{{ secrets_hashi_vault_secret_id | default('') }}"
minio_server_credentials_vault_token: "{{ secrets_hashi_vault_token | default('') }}"
minio_server_credentials_vault_ca_cert: "{{ secrets_hashi_vault_ca_cert | default('') }}"

minio_server_no_log: true
