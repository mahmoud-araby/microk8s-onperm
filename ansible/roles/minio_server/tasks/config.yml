---
- name: Drives are mounted (role storage_prep formats minio_drives as XFS at /mnt/disk1..N)
  ansible.builtin.assert:
    that: ansible_facts['mounts'] | selectattr('mount', 'equalto', item) | list | length == 1
    fail_msg: "{{ item }} is not a mount point on {{ inventory_hostname }} - run playbooks/storage-prep.yml first"
    quiet: true
  loop: "{{ _minio_drive_paths }}"

- name: Create the MinIO data directory on every drive
  ansible.builtin.file:
    path: "{{ item }}/{{ minio_server_drive_subdir }}"
    state: directory
    owner: "{{ minio_server_user }}"
    group: "{{ minio_server_group }}"
    mode: "0750"
  loop: "{{ _minio_drive_paths }}"

- name: Resolve every MinIO node name used in MINIO_VOLUMES (/etc/hosts)
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - minio_servers"
    block: |
      {% for host in groups['minio_servers'] %}
      {{ hostvars[host]['ansible_host'] }} {{ minio_server_host_prefix }}{{ loop.index }}.{{ minio_server_domain }} {{ host }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: minio_server_manage_etc_hosts | bool

- name: Render the MinIO environment file
  ansible.builtin.template:
    src: minio.env.j2
    dest: "{{ minio_server_config_file }}"
    owner: root
    group: "{{ minio_server_group }}"
    mode: "0640"
  notify: Restart minio
  no_log: "{{ minio_server_no_log }}"

- name: Hardened systemd unit
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart minio
