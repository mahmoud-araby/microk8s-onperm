---
# Declarative repository secret (label argocd.argoproj.io/secret-type=repository).
- name: Validate repository credentials are present
  ansible.builtin.assert:
    that: >-
      (argocd_repo_auth_method == 'https' and argocd_repo_password | length > 0)
      or (argocd_repo_auth_method == 'ssh' and argocd_repo_ssh_private_key | length > 0)
    fail_msg: >-
      Repository credentials missing: set vault_argocd_repo_password (https) or
      vault_argocd_repo_ssh_private_key (ssh) in inventories/<env>/group_vars/all/vault.yml,
      or set argocd_repo_auth_method: none for a public repository.
    quiet: true

- name: Create the platform repository secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: repo-platform-gitops
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
          app.kubernetes.io/managed-by: ansible
      stringData: >-
        {{ {'type': 'git', 'name': 'platform-gitops', 'project': 'default',
            'url': argocd_repo_url, 'username': argocd_repo_username, 'password': argocd_repo_password}
           if argocd_repo_auth_method == 'https' else
           {'type': 'git', 'name': 'platform-gitops', 'project': 'default',
            'url': argocd_repo_ssh_url, 'sshPrivateKey': argocd_repo_ssh_private_key} }}
  no_log: true
