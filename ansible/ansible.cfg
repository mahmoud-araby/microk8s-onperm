# Ansible configuration for the MicroK8s on-prem platform.
# Run every command from the ansible/ directory so this file is picked up:
#   cd ansible && ansible-playbook -i inventories/production/hosts.yml playbooks/site.yml
# Requires ansible-core >= 2.16.

[defaults]
# Default to STAGING so an accidental run never touches production.
inventory = inventories/staging/hosts.yml
roles_path = ./roles
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
filter_plugins = ./filter_plugins
interpreter_python = auto_silent
forks = 25
timeout = 30
host_key_checking = True
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 7200
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
callback_result_format = yaml
display_skipped_hosts = False
any_errors_fatal = False
# Vault identities (one password file per environment). Uncomment once the files exist:
# vault_identity_list = staging@~/.ansible/vault-pass-staging, production@~/.ansible/vault-pass-production

[inventory]
enable_plugins = ansible.builtin.yaml, ansible.builtin.ini

[privilege_escalation]
# Roles/plays opt in with `become: true` where root is required.
become = False
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
control_path_dir = ~/.ansible/cp

[diff]
always = False
context = 3
