---
# Install the dqlite/PKI backup timer on every control-plane node.
#   -e backup_run_now=true   trigger a backup immediately
#   -e backup_fetch=true     pull the newest archives to ansible/backups/<cluster>/
- name: dqlite backups
  hosts: microk8s_masters
  become: true
  gather_facts: true
  roles:
    - role: backup
      tags: [backup]
