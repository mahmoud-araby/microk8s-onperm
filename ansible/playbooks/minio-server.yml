---
# OPTIONAL: external distributed MinIO on VMs (inventory group minio_servers) = backup target outside the
# cluster failure domain, https://minio.storage.example.local:9000 (docs/conventions.md "Object storage").
#   ansible-playbook -i inventories/production/hosts.yml playbooks/minio-server.yml --vault-id production@prompt
# Drives (minio_drives) are formatted XFS and mounted at /mnt/disk1..N first (role storage_prep, guarded),
# then MinIO is installed on all nodes at once (distributed pools start together), and the first node
# creates buckets, ILM, per-consumer users/policies and pushes the credentials (Vault or ansible-vault file).
# The play is a no-op when minio_servers is empty.
- name: External MinIO - hardening, drives, install, buckets and identities
  hosts: minio_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: hardening
      tags: [hardening]
    - role: storage_prep
      tags: [storage_prep]
    - role: minio_server
      tags: [minio_server]
