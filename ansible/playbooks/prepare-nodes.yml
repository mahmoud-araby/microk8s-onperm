---
# OS baseline (packages, chrony, swap, kernel modules, sysctl, limits, Longhorn prerequisites,
# firewall, journald), dedicated data disks (storage_prep: local-nvme, MinIO drives, NFS client)
# + CIS-inspired hardening on every cluster node.
- name: Prepare cluster nodes
  hosts: microk8s_cluster
  become: true
  gather_facts: true
  any_errors_fatal: false
  max_fail_percentage: 10
  roles:
    - role: common
      tags: [common]
    - role: storage_prep
      tags: [storage_prep]
      vars:
        storage_prep_longhorn: false      # role common has just prepared the Longhorn disk
    - role: hardening
      tags: [hardening]
