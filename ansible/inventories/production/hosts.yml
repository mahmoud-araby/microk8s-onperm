---
# PRODUCTION inventory - MicroK8s HA cluster sized for ~1,000,000 users.
#
# Group layout (binding, see docs/conventions.md "Nodes"):
#   microk8s_cluster
#   ├── microk8s_masters      3 control-plane nodes = dqlite voters (keep an odd number)
#   └── microk8s_workers      joined with `microk8s join --worker`
#       ├── edge              workload-tier=edge          taint workload-tier=edge:NoSchedule
#       ├── platform          workload-tier=platform
#       ├── data              workload-tier=data          taint workload-tier=data:NoSchedule
#       ├── apps              workload-tier=apps
#       ├── observability     workload-tier=observability
#       └── storage           workload-tier=storage       taint workload-tier=storage:NoSchedule
#   vault_servers / minio_servers   external Vault / MinIO VMs (not Kubernetes nodes)
#
# Inventory hostnames ARE the Kubernetes node names (the common role sets the OS hostname).
# `ansible_host` is the node's primary (cluster) IP and is used as the MicroK8s advertise address.
# `topology_zone` becomes the node label topology.kubernetes.io/zone (rack / room / hypervisor
# failure domain) used by Longhorn, Kafka rack awareness and topologySpreadConstraints.
all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_platform
    ansible_python_interpreter: /usr/bin/python3
  children:
    controller:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # Edge load balancers (HAProxy + keepalived, role `loadbalancer`) - NOT Kubernetes nodes.
    # They float lb_public_vip / lb_internal_vip (group_vars/all/loadbalancer.yml).
    loadbalancers:
      hosts:
        prd-lb-01: {ansible_host: 10.10.20.11, topology_zone: zone-a}
        prd-lb-02: {ansible_host: 10.10.20.12, topology_zone: zone-b}

    # External HashiCorp Vault HA (raft, role `vault_server`) - NOT Kubernetes nodes.
    # https://vault-ext.example.local:8200 = DNS round-robin / LB VIP over these nodes.
    vault_servers:
      hosts:
        vault-01: {ansible_host: 10.10.30.11, topology_zone: zone-a}
        vault-02: {ansible_host: 10.10.30.12, topology_zone: zone-b}
        vault-03: {ansible_host: 10.10.30.13, topology_zone: zone-c}

    # External distributed MinIO (role `minio_server`, backup target) - NOT Kubernetes nodes.
    # 4 nodes x 4 drives (erasure coding); in MINIO_VOLUMES the nodes are minio-1..4.storage.example.local
    # (index in this group), https://minio.storage.example.local:9000 = round-robin DNS / VIP.
    # minio_drives are formatted XFS and mounted at /mnt/disk1..4 by role storage_prep.
    minio_servers:
      vars:
        minio_drives: [/dev/sdb, /dev/sdc, /dev/sdd, /dev/sde]
      hosts:
        minio-01: {ansible_host: 10.10.31.11, topology_zone: zone-a}
        minio-02: {ansible_host: 10.10.31.12, topology_zone: zone-b}
        minio-03: {ansible_host: 10.10.31.13, topology_zone: zone-c}
        minio-04: {ansible_host: 10.10.31.14, topology_zone: zone-a}

    microk8s_cluster:
      children:
        microk8s_masters:
          hosts:
            prd-master-01: {ansible_host: 10.10.10.11, topology_zone: zone-a}
            prd-master-02: {ansible_host: 10.10.10.12, topology_zone: zone-b}
            prd-master-03: {ansible_host: 10.10.10.13, topology_zone: zone-c}

        microk8s_workers:
          children:
            edge:
              hosts:
                prd-edge-01: {ansible_host: 10.10.11.11, topology_zone: zone-a}
                prd-edge-02: {ansible_host: 10.10.11.12, topology_zone: zone-b}
                prd-edge-03: {ansible_host: 10.10.11.13, topology_zone: zone-c}

            platform:
              hosts:
                prd-platform-01: {ansible_host: 10.10.12.11, topology_zone: zone-a}
                prd-platform-02: {ansible_host: 10.10.12.12, topology_zone: zone-b}
                prd-platform-03: {ansible_host: 10.10.12.13, topology_zone: zone-c}
                prd-platform-04: {ansible_host: 10.10.12.14, topology_zone: zone-a}
                prd-platform-05: {ansible_host: 10.10.12.15, topology_zone: zone-b}
                prd-platform-06: {ansible_host: 10.10.12.16, topology_zone: zone-c}

            data:
              # Each data node has a dedicated NVMe device for Longhorn (longhorn-db, strict-local).
              hosts:
                prd-data-01: {ansible_host: 10.10.13.11, topology_zone: zone-a, longhorn_disk_device: /dev/nvme1n1}
                prd-data-02: {ansible_host: 10.10.13.12, topology_zone: zone-b, longhorn_disk_device: /dev/nvme1n1}
                prd-data-03: {ansible_host: 10.10.13.13, topology_zone: zone-c, longhorn_disk_device: /dev/nvme1n1}
                prd-data-04: {ansible_host: 10.10.13.14, topology_zone: zone-a, longhorn_disk_device: /dev/nvme1n1}
                prd-data-05: {ansible_host: 10.10.13.15, topology_zone: zone-b, longhorn_disk_device: /dev/nvme1n1}
                prd-data-06: {ansible_host: 10.10.13.16, topology_zone: zone-c, longhorn_disk_device: /dev/nvme1n1}

            apps:
              hosts:
                prd-apps-01: {ansible_host: 10.10.14.11, topology_zone: zone-a}
                prd-apps-02: {ansible_host: 10.10.14.12, topology_zone: zone-b}
                prd-apps-03: {ansible_host: 10.10.14.13, topology_zone: zone-c}
                prd-apps-04: {ansible_host: 10.10.14.14, topology_zone: zone-a}
                prd-apps-05: {ansible_host: 10.10.14.15, topology_zone: zone-b}
                prd-apps-06: {ansible_host: 10.10.14.16, topology_zone: zone-c}
                prd-apps-07: {ansible_host: 10.10.14.17, topology_zone: zone-a}
                prd-apps-08: {ansible_host: 10.10.14.18, topology_zone: zone-b}
                prd-apps-09: {ansible_host: 10.10.14.19, topology_zone: zone-c}
                prd-apps-10: {ansible_host: 10.10.14.20, topology_zone: zone-a}
                prd-apps-11: {ansible_host: 10.10.14.21, topology_zone: zone-b}
                prd-apps-12: {ansible_host: 10.10.14.22, topology_zone: zone-c}

            observability:
              # Elasticsearch hot tier lives here -> dedicated NVMe as well.
              hosts:
                prd-obs-01: {ansible_host: 10.10.15.11, topology_zone: zone-a, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-02: {ansible_host: 10.10.15.12, topology_zone: zone-b, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-03: {ansible_host: 10.10.15.13, topology_zone: zone-c, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-04: {ansible_host: 10.10.15.14, topology_zone: zone-a, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-05: {ansible_host: 10.10.15.15, topology_zone: zone-b, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-06: {ansible_host: 10.10.15.16, topology_zone: zone-c, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-07: {ansible_host: 10.10.15.17, topology_zone: zone-a, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-08: {ansible_host: 10.10.15.18, topology_zone: zone-b, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-09: {ansible_host: 10.10.15.19, topology_zone: zone-c, longhorn_disk_device: /dev/nvme1n1}
                prd-obs-10: {ansible_host: 10.10.15.20, topology_zone: zone-a, longhorn_disk_device: /dev/nvme1n1}

            storage:
              # In-cluster MinIO tenant on the `local-nvme` storage class (local-path provisioner on
              # /mnt/local-nvme, prepared by role storage_prep). Tainted workload-tier=storage:NoSchedule.
              hosts:
                prd-storage-01: {ansible_host: 10.10.16.11, topology_zone: zone-a}
                prd-storage-02: {ansible_host: 10.10.16.12, topology_zone: zone-b}
                prd-storage-03: {ansible_host: 10.10.16.13, topology_zone: zone-c}
                prd-storage-04: {ansible_host: 10.10.16.14, topology_zone: zone-a}
