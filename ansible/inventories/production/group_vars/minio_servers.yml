---
# External distributed MinIO (role minio_server, playbooks/minio-server.yml) - backup target outside the
# cluster failure domain. docs/conventions.md "Object storage (MinIO)". Not Kubernetes nodes.
#
# DNS (or the `loadbalancers` HAProxy pair) must provide:
#   minio-1..4.storage.example.local -> each node (also written to /etc/hosts on the MinIO nodes)
#   minio.storage.example.local      -> round-robin A records over all nodes, or a VIP (TCP passthrough :9000,
#                                        health check GET /minio/health/live) - the endpoint every consumer uses.
# Community MinIO is source-only: build from the pinned tags on the controller (git + Go), or set
# minio_server_binary_source: url + minio_server_binary_url/_sha256 + minio_server_mc_url/_mc_sha256 (internal mirror).
minio_server_binary_source: build
minio_server_release: RELEASE.2025-10-15T17-29-55Z
minio_server_mc_release: RELEASE.2025-08-13T08-35-41Z
minio_server_domain: "storage.{{ platform_internal_domain }}"
minio_server_tls_mode: internal_ca
# 4 nodes x 4 drives = 16 drives, one erasure set of 16: EC:4 tolerates 4 lost drives (or one node).
minio_server_storage_class_standard: "EC:4"
minio_server_prometheus_auth_type: jwt

# Clients of :9000 - cluster nodes (CNPG, Velero, Thanos, ES, Longhorn, Harbor), admins, LB pair
minio_server_firewall_client_cidrs: "{{ platform_node_cidrs + platform_admin_cidrs + ([lb_subnet_cidr] if lb_subnet_cidr is defined else []) }}"

# Storage prep (XFS on minio_drives -> /mnt/disk1..N); drives are listed in hosts.yml
storage_prep_nfs_client: false
storage_prep_longhorn: false
