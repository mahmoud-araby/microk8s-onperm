---
# ---------------------------------------------------------------------------
# Secrets source + Vault topology - PRODUCTION
#
# secrets_backend:
#   ansible_vault   (default) every secret comes from group_vars/all/vault.yml (ansible-vault encrypted)
#   hashicorp_vault           secrets are read from the EXTERNAL Vault (role vault_server,
#                             https://vault-ext.example.local:8200) with community.hashi_vault lookups,
#                             KV v2 mount `secret`, paths secret/ansible/<environment>/<group>, AppRole `ansible`:
#                               export VAULT_ADDR=https://vault-ext.example.local:8200   (optional, default below)
#                               export VAULT_ROLE_ID=<role_id> VAULT_SECRET_ID=<secret_id>
#                             Requires `pip install hvac` on the controller.
#
# This file maps every secret-bearing role input to its source, so roles never care where a secret
# lives. Lookups are lazy: a secret is only fetched when a play actually uses it.
# Bootstrap secrets of the external Vault itself (vault_ext_unseal_keys / vault_ext_root_token) and
# vault_internal_ca_key_passphrase ALWAYS stay in ansible-vault (chicken-and-egg).
#
# vault_deployment_mode (docs/conventions.md "External Vault (optional)"):
#   in-cluster (default) only the in-cluster Vault (namespace vault, Shamir unseal by vault-init.yml)
#   external             + external Vault on VMs: transit auto-unseal of the in-cluster Vault (key autounseal-k8s)
#                          and Ansible secrets source; applications keep using the in-cluster Vault through ESO
#   both                 as external, and ESO may also read the external Vault (ClusterSecretStore on
#                          vault-ext) for secrets that must survive the loss of the cluster (backup credentials)
# ---------------------------------------------------------------------------

secrets_backend: ansible_vault
vault_deployment_mode: in-cluster

# --- External Vault connection (lookups + modules) -----------------------------------------------
secrets_hashi_vault_url: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('https://vault-ext.' ~ platform_internal_domain ~ ':8200', true) }}"
secrets_hashi_vault_ca_cert: "{{ lookup('ansible.builtin.env', 'VAULT_CACERT') | default(inventory_dir ~ '/files/internal-ca.crt', true) }}"
secrets_hashi_vault_auth_method: approle          # approle | token (VAULT_TOKEN, break-glass)
secrets_hashi_vault_role_id: "{{ lookup('ansible.builtin.env', 'VAULT_ROLE_ID') }}"
secrets_hashi_vault_secret_id: "{{ lookup('ansible.builtin.env', 'VAULT_SECRET_ID') }}"
secrets_hashi_vault_token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
secrets_hashi_vault_mount: secret
secrets_hashi_vault_prefix: "ansible/{{ platform_environment }}"

# Defaults picked up by every community.hashi_vault lookup
ansible_hashi_vault_url: "{{ secrets_hashi_vault_url }}"
ansible_hashi_vault_ca_cert: "{{ secrets_hashi_vault_ca_cert }}"
ansible_hashi_vault_auth_method: "{{ secrets_hashi_vault_auth_method }}"
ansible_hashi_vault_role_id: "{{ secrets_hashi_vault_role_id }}"
ansible_hashi_vault_secret_id: "{{ secrets_hashi_vault_secret_id }}"
ansible_hashi_vault_engine_mount_point: "{{ secrets_hashi_vault_mount }}"

secrets_use_hashicorp_vault: "{{ secrets_backend == 'hashicorp_vault' }}"

# ===========================================================================
# Secret map: role input  <-  ansible-vault variable  |  secret/<prefix>/<path> key
# ===========================================================================

# --- Argo CD (role argocd_bootstrap)                  secret/ansible/<env>/argocd -------------------
argocd_repo_username: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/argocd').secret.repo_username | default('git', true))
     if secrets_use_hashicorp_vault | bool else (vault_argocd_repo_username | default('git')) }}
argocd_repo_password: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/argocd').secret.repo_password | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_argocd_repo_password | default('')) }}
argocd_repo_ssh_private_key: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/argocd').secret.repo_ssh_private_key | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_argocd_repo_ssh_private_key | default('')) }}
argocd_repo_auth_method: >-
  {{ 'https' if (argocd_repo_password | length > 0)
     else ('ssh' if (argocd_repo_ssh_private_key | length > 0) else 'none') }}
argocd_oidc_client_secret: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/argocd').secret.oidc_client_secret | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_argocd_oidc_client_secret | default('')) }}
argocd_admin_password_bcrypt: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/argocd').secret.admin_password_bcrypt | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_argocd_admin_password_bcrypt | default('')) }}

# --- Harbor pull robot (reserved: no role consumes it yet)   secret/ansible/<env>/registry --------
registry_username: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/registry').secret.username | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_registry_username | default('')) }}
registry_password: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/registry').secret.password | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_registry_password | default('')) }}

# --- In-cluster Vault bootstrap (role vault_init)      secret/ansible/<env>/vault-in-cluster ---------
vault_init_unseal_keys: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/vault-in-cluster').secret.unseal_keys | default([]))
     if secrets_use_hashicorp_vault | bool else (vault_unseal_keys | default([])) }}
vault_init_root_token: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/vault-in-cluster').secret.root_token | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_root_token | default('')) }}
# Transit auto-unseal token written by role vault_server   secret/platform/vault-transit-token (key token)
vault_init_transit_token: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', 'platform/vault-transit-token').secret.token | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_ext_transit_token | default('')) }}

# --- dqlite backups (role backup)                      secret/ansible/<env>/backup -------------------
backup_remote_ssh_private_key: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/backup').secret.ssh_private_key | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_backup_ssh_private_key | default('')) }}

# dqlite archives -> external MinIO bucket platform-dqlite (backup_s3_enabled)   secret/platform/dqlite-s3
# (written by role minio_server, consumer `dqlite`)
backup_s3_access_key: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', 'platform/dqlite-s3').secret.ACCESS_KEY_ID | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_backup_s3_access_key | default('')) }}
backup_s3_secret_key: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', 'platform/dqlite-s3').secret.ACCESS_SECRET_KEY | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_backup_s3_secret_key | default('')) }}

# --- Edge load balancers (role loadbalancer)           secret/ansible/<env>/loadbalancer -------------
lb_keepalived_auth_pass: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/loadbalancer').secret.keepalived_auth_pass | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_lb_keepalived_auth_pass | default('')) }}
lb_stats_password: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', secrets_hashi_vault_prefix ~ '/loadbalancer').secret.stats_password | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_lb_stats_password | default('')) }}

# --- External MinIO root credentials (role minio_server)   secret/platform/minio-external -----------
# (docs/conventions.md: "MinIO root credentials: Vault secret/platform/minio-external (VMs)")
minio_server_root_user: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', 'platform/minio-external').secret['root-user'] | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_minio_external_root_user | default('')) }}
minio_server_root_password: >-
  {{ (lookup('community.hashi_vault.vault_kv2_get', 'platform/minio-external').secret['root-password'] | default(''))
     if secrets_use_hashicorp_vault | bool else (vault_minio_external_root_password | default('')) }}
