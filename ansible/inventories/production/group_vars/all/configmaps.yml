---
# ---------------------------------------------------------------------------
# "ConfigMap Ansible" - PRODUCTION (role: k8s_configmaps, playbook: configmaps.yml)
#
# Layering (later wins, deep merge, lists replace):
#   1. global       roles/k8s_configmaps/defaults/main.yml  -> k8s_configmaps_global
#   2. environment  THIS FILE                               -> k8s_configmaps_environment
#   3. tenant       ansible/configmaps/tenants/<tenant>.yml -> config + environments.<env>
#   4. service      ansible/configmaps/services/<svc>.yml (catalogue defaults)
#                   + tenant file services[].config + services[].environments.<env>
# ---------------------------------------------------------------------------

# apply  -> kubernetes.core.k8s apply to the cluster + checksum annotation rollout trigger
# gitops -> write YAML to gitops/tenants/<tenant>/configmaps/generated-*.yaml for Argo CD (default;
#           hand-written files such as tenant-feature-flags.yaml are never touched)
k8s_configmaps_mode: gitops

k8s_configmaps_environment:
  environment: production
  logging:
    level: info
  otel:
    tracesSamplerRatio: 0.05
  database:
    sslMode: require
    poolMin: 10
    poolMax: 80
  http:
    timeoutSeconds: 10
    retries: 2
  rabbitmq:
    prefetch: 100
  features:
    maintenanceBanner: false
