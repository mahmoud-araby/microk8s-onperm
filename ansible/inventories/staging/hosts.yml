---
# STAGING inventory - same topology as production, smaller footprint.
# Masters are NOT dedicated in staging (microk8s_dedicated_masters: false).
all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_platform
    ansible_python_interpreter: /usr/bin/python3
  children:
    controller:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    microk8s_cluster:
      children:
        microk8s_masters:
          hosts:
            stg-master-01: {ansible_host: 10.20.10.11, topology_zone: zone-a}
            stg-master-02: {ansible_host: 10.20.10.12, topology_zone: zone-b}
            stg-master-03: {ansible_host: 10.20.10.13, topology_zone: zone-c}

        microk8s_workers:
          children:
            edge:
              hosts:
                stg-edge-01: {ansible_host: 10.20.11.11, topology_zone: zone-a}
                stg-edge-02: {ansible_host: 10.20.11.12, topology_zone: zone-b}
            platform:
              hosts:
                stg-platform-01: {ansible_host: 10.20.12.11, topology_zone: zone-a}
                stg-platform-02: {ansible_host: 10.20.12.12, topology_zone: zone-b}
                stg-platform-03: {ansible_host: 10.20.12.13, topology_zone: zone-c}
            data:
              # 3 data nodes keep quorum semantics identical to production (Kafka/RabbitMQ/Postgres)
              hosts:
                stg-data-01: {ansible_host: 10.20.13.11, topology_zone: zone-a, longhorn_disk_device: /dev/sdb}
                stg-data-02: {ansible_host: 10.20.13.12, topology_zone: zone-b, longhorn_disk_device: /dev/sdb}
                stg-data-03: {ansible_host: 10.20.13.13, topology_zone: zone-c, longhorn_disk_device: /dev/sdb}
            apps:
              hosts:
                stg-apps-01: {ansible_host: 10.20.14.11, topology_zone: zone-a}
                stg-apps-02: {ansible_host: 10.20.14.12, topology_zone: zone-b}
                stg-apps-03: {ansible_host: 10.20.14.13, topology_zone: zone-c}
            observability:
              hosts:
                stg-obs-01: {ansible_host: 10.20.15.11, topology_zone: zone-a}
