---
# External MinIO (role minio_server) - STAGING: 1 node / 1 drive (MINIO_VOLUMES=/mnt/disk1/minio, no erasure coding).
# Community MinIO is source-only: build from the pinned tags on the controller (git + Go), or set
# minio_server_binary_source: url + minio_server_binary_url/_sha256 + minio_server_mc_url/_mc_sha256 (internal mirror).
minio_server_binary_source: build
minio_server_release: RELEASE.2025-10-15T17-29-55Z
minio_server_mc_release: RELEASE.2025-08-13T08-35-41Z
minio_server_domain: "storage.{{ platform_internal_domain }}"
minio_server_tls_mode: internal_ca
minio_server_storage_class_standard: ""
minio_server_prometheus_auth_type: jwt
minio_server_firewall_client_cidrs: "{{ platform_node_cidrs + platform_admin_cidrs + ([lb_subnet_cidr] if lb_subnet_cidr is defined else []) }}"
pki_cert_create_ca: true

storage_prep_nfs_client: false
storage_prep_longhorn: false
