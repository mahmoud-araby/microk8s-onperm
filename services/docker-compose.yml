# Local development stack: infrastructure + the four reference services.
#   docker compose up -d --build          # everything
#   docker compose up -d postgres redis rabbitmq kafka otel-collector payment-provider   # infra only (run services from IDE)
# Ports on the host: web 8080, catalog 8081, orders 8082, payments 8083, postgres 5432, redis 6379,
# rabbitmq 5672/15672, kafka 29092, otlp 4317/4318, payment provider mock 8089.
name: platform-services

x-service-defaults: &service-defaults
  read_only: true                 # same as readOnlyRootFilesystem in the chart
  tmpfs: [/tmp]
  user: "10001:10001"
  restart: unless-stopped
  stop_grace_period: 30s          # terminationGracePeriodSeconds

x-platform-env: &platform-env
  ENVIRONMENT: local
  TENANT_ID: acme
  APP_VERSION: dev
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318   # same protocol as charts/microservice
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_KEY_PREFIX: "acme:"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  RABBITMQ_VHOST: /
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT   # clusters: SASL_PLAINTEXT/SASL_SSL + KAFKA_SASL_MECHANISM/USERNAME/PASSWORD
  KAFKA_TOPIC_PREFIX: "acme."

x-depends-infra: &depends-infra
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  rabbitmq: {condition: service_healthy}
  kafka: {condition: service_healthy}

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./dev/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./dev/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]

  payment-provider:               # WireMock stand-in for the external PSP (reached via Istio egress in clusters)
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--disable-banner"]
    volumes:
      - ./dev/payment-provider/mappings:/home/wiremock/mappings:ro
    ports: ["8089:8080"]

  # ---------------------------------------------------------------- services
  catalog:
    <<: *service-defaults
    build: ./catalog-python
    image: platform/catalog:dev
    environment:
      <<: *platform-env
      APP_NAME: catalog
      OTEL_SERVICE_NAME: catalog
      DB_NAME: catalog
      DB_USER: catalog
      DB_PASSWORD: catalog
      KAFKA_ENABLED: "true"
    ports: ["8081:8080"]
    depends_on: *depends-infra

  orders:
    <<: *service-defaults
    build: ./orders-dotnet
    image: platform/orders:dev
    environment:
      <<: *platform-env
      ASPNETCORE_ENVIRONMENT: Development
      APP_NAME: orders
      OTEL_SERVICE_NAME: orders
      DB_NAME: orders
      DB_USER: orders
      DB_PASSWORD: orders
      DB_AUTO_MIGRATE: "true"
      CATALOG_BASE_URL: http://catalog:8080/
    ports: ["8082:8080"]
    depends_on:
      <<: *depends-infra
      catalog: {condition: service_started}

  payments:
    <<: *service-defaults
    build: ./payments-java
    image: platform/payments:dev
    environment:
      <<: *platform-env
      APP_NAME: payments
      OTEL_SERVICE_NAME: payments
      DB_NAME: payments
      DB_USER: payments
      DB_PASSWORD: payments
      PAYMENT_PROVIDER_URL: http://payment-provider:8080
    ports: ["8083:8080"]
    depends_on:
      <<: *depends-infra
      payment-provider: {condition: service_started}

  web:
    <<: *service-defaults
    build: ./web-frontend
    image: platform/web:dev
    volumes:
      - ./dev/web/config.js:/usr/share/nginx/html/config.js:ro
      - ./dev/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]
    depends_on: [orders, catalog]

volumes:
  pgdata:
