# Default server config baked into the image (the frontend Helm chart mounts its own at runtime).
# nginx-unprivileged: listens on 8080, pid/temp files in /tmp -> works with readOnlyRootFilesystem + /tmp emptyDir.
log_format json_access escape=json
  '{"@timestamp":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
  '"user_agent":"$http_user_agent","correlation_id":"$http_x_correlation_id","traceparent":"$http_traceparent",'
  '"tenant_id":"$http_x_tenant_id"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /dev/stdout json_access;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' https: data:; style-src 'self'; frame-ancestors 'none'" always;

  # Probes (same paths as the microservice contract)
  location ~ ^/health/(live|ready|startup)$ {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP"}';
  }

  # nginx-prometheus-exporter sidecar scrapes this and serves /metrics
  location = /nginx_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    deny all;
  }

  # Runtime tenant config: never cached
  location = /config.js {
    expires -1;
  }

  # Content-hashed assets: cache for a year
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback; index.html must always be revalidated
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
