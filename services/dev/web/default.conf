# Local only: emulates Kong's path routing (/<service>/<version>/... with strip_path) so the SPA can call
# relative URLs without CORS. In clusters Kong does this and the chart provides the nginx config.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location ~ ^/health/(live|ready|startup)$ { default_type application/json; return 200 '{"status":"UP"}'; }
  location /orders/v1/  { proxy_pass http://orders:8080/;  proxy_set_header X-Tenant-ID $http_x_tenant_id; }
  location /catalog/v1/ { proxy_pass http://catalog:8080/; proxy_set_header X-Tenant-ID $http_x_tenant_id; }
  location = /config.js { expires -1; }
  location / { try_files $uri $uri/ /index.html; }
}
