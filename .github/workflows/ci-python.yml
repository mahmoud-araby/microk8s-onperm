# catalog (Python 3.12 / FastAPI): build + test -> SAST + dependency scan -> image -> GitOps promotion.
name: ci-python

on:
  push:
    branches: [main]
    paths:
      - services/catalog-python/**
      - .github/workflows/ci-python.yml
      - .github/workflows/_reusable-container.yml
      - .github/workflows/_reusable-gitops-bump.yml
  pull_request:
    paths:
      - services/catalog-python/**
      - .github/workflows/ci-python.yml
      - .github/workflows/_reusable-container.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SERVICE_DIR: services/catalog-python
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      api_version: ${{ steps.version.outputs.api_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - run: pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: catalog-test-results
          path: ${{ env.SERVICE_DIR }}/test-results.xml
          retention-days: 14
      - name: Version (from pyproject.toml)
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "api_version=v${version%%.*}" >> "$GITHUB_OUTPUT"

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          build-mode: none
          source-root: ${{ env.SERVICE_DIR }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:python/service:catalog

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit (PyPI advisories)
        run: |
          pip install pip-audit
          pip-audit --strict -r ${{ env.SERVICE_DIR }}/requirements.txt
      - name: Trivy filesystem scan (secrets, Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    needs: [build-test, sast, dependency-scan]
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/_reusable-container.yml
    with:
      service: catalog
      context: services/catalog-python
      version: ${{ needs.build-test.outputs.version }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  gitops-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-test, container]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-gitops-bump.yml
    with:
      service: catalog
      tag: ${{ needs.container.outputs.tag }}
      api_version: ${{ needs.build-test.outputs.api_version }}
      environment: staging
      base_branch: ${{ vars.GITOPS_STAGING_BRANCH || 'staging' }}
      auto_merge: true
    secrets: inherit

  gitops-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-test, container, gitops-staging]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-gitops-bump.yml
    with:
      service: catalog
      tag: ${{ needs.container.outputs.tag }}
      api_version: ${{ needs.build-test.outputs.api_version }}
      environment: production
      base_branch: ${{ vars.GITOPS_PRODUCTION_BRANCH || 'main' }}
      auto_merge: false
    secrets: inherit
