# web (Vite + React SPA): build + test -> SAST + dependency scan -> image -> GitOps promotion.
name: ci-frontend

on:
  push:
    branches: [main]
    paths:
      - services/web-frontend/**
      - .github/workflows/ci-frontend.yml
      - .github/workflows/_reusable-container.yml
      - .github/workflows/_reusable-gitops-bump.yml
  pull_request:
    paths:
      - services/web-frontend/**
      - .github/workflows/ci-frontend.yml
      - .github/workflows/_reusable-container.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SERVICE_DIR: services/web-frontend

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      api_version: ${{ steps.version.outputs.api_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Version (from package.json)
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "api_version=v${version%%.*}" >> "$GITHUB_OUTPUT"

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          source-root: ${{ env.SERVICE_DIR }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript/service:web

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm audit (production dependencies)
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan (lockfile, secrets, Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    needs: [build-test, sast, dependency-scan]
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/_reusable-container.yml
    with:
      service: web
      context: services/web-frontend
      version: ${{ needs.build-test.outputs.version }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  gitops-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-test, container]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-gitops-bump.yml
    with:
      service: web
      tag: ${{ needs.container.outputs.tag }}
      api_version: ${{ needs.build-test.outputs.api_version }}
      environment: staging
      base_branch: ${{ vars.GITOPS_STAGING_BRANCH || 'staging' }}
      auto_merge: true
    secrets: inherit

  gitops-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-test, container, gitops-staging]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-gitops-bump.yml
    with:
      service: web
      tag: ${{ needs.container.outputs.tag }}
      api_version: ${{ needs.build-test.outputs.api_version }}
      environment: production
      base_branch: ${{ vars.GITOPS_PRODUCTION_BRANCH || 'main' }}
      auto_merge: false
    secrets: inherit
