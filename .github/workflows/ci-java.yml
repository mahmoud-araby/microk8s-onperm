# payments (Java 21 / Spring Boot): build + test -> SAST + dependency scan -> image -> GitOps promotion.
name: ci-java

on:
  push:
    branches: [main]
    paths:
      - services/payments-java/**
      - .github/workflows/ci-java.yml
      - .github/workflows/_reusable-container.yml
      - .github/workflows/_reusable-gitops-bump.yml
  pull_request:
    paths:
      - services/payments-java/**
      - .github/workflows/ci-java.yml
      - .github/workflows/_reusable-container.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SERVICE_DIR: services/payments-java
  MAVEN_ARGS: -B --no-transfer-progress

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      api_version: ${{ steps.version.outputs.api_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.SERVICE_DIR }}/pom.xml
      - run: mvn verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: payments-test-results
          path: ${{ env.SERVICE_DIR }}/target/surefire-reports
          retention-days: 14
      - name: Version (from pom.xml)
        id: version
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "api_version=v${version%%.*}" >> "$GITHUB_OUTPUT"

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: none
          source-root: ${{ env.SERVICE_DIR }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java/service:payments

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (Maven dependencies, secrets, Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    needs: [build-test, sast, dependency-scan]
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/_reusable-container.yml
    with:
      service: payments
      context: services/payments-java
      version: ${{ needs.build-test.outputs.version }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  gitops-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-test, container]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-gitops-bump.yml
    with:
      service: payments
      tag: ${{ needs.container.outputs.tag }}
      api_version: ${{ needs.build-test.outputs.api_version }}
      environment: staging
      base_branch: ${{ vars.GITOPS_STAGING_BRANCH || 'staging' }}
      auto_merge: true
    secrets: inherit

  gitops-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-test, container, gitops-staging]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-gitops-bump.yml
    with:
      service: payments
      tag: ${{ needs.container.outputs.tag }}
      api_version: ${{ needs.build-test.outputs.api_version }}
      environment: production
      base_branch: ${{ vars.GITOPS_PRODUCTION_BRANCH || 'main' }}
      auto_merge: false
    secrets: inherit
