# Reusable: build the service image with buildx (GitHub cache), scan it with Trivy (fail on CRITICAL), generate an
# SBOM (syft), push to Harbor as <semver>-<sha>, sign it with cosign and attach the SBOM as a signed attestation.
#
# Harbor (harbor.ops.example.local) is only reachable from inside the platform network: set the repository
# variable CI_RUNNER_LABELS to the self-hosted runner labels, e.g. ["self-hosted","linux","platform"].
# Signing key: COSIGN_PRIVATE_KEY / COSIGN_PASSWORD (key pair kept in Vault secret/platform/cosign; Kyverno
# policy verify-image-signatures holds the public key). Without the key, keyless (OIDC) signing is used.
name: reusable-container

on:
  workflow_call:
    inputs:
      service:
        description: Service name (image repository platform/<service>)
        required: true
        type: string
      context:
        description: Docker build context (service directory)
        required: true
        type: string
      version:
        description: Semantic version; the image tag is <version>-<short sha>
        required: true
        type: string
      push:
        description: Push, sign and attest (false on pull requests)
        required: false
        type: boolean
        default: false
      platforms:
        description: Target platforms for the pushed image
        required: false
        type: string
        default: linux/amd64
    secrets:
      HARBOR_USERNAME:
        required: false
      HARBOR_PASSWORD:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
    outputs:
      image:
        description: Image repository without tag
        value: ${{ jobs.image.outputs.image }}
      tag:
        description: Image tag (<semver>-<sha>)
        value: ${{ jobs.image.outputs.tag }}
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

env:
  REGISTRY: harbor.ops.example.local
  PROJECT: platform

jobs:
  image:
    name: image (${{ inputs.service }})
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # Trivy SARIF upload
      actions: read
      id-token: write          # keyless cosign fallback
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image reference
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not semver"; exit 1
          fi
          tag="${VERSION}-${GITHUB_SHA::7}"
          echo "image=${REGISTRY}/${PROJECT}/${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "### ${SERVICE}: \`${REGISTRY}/${PROJECT}/${SERVICE}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy image report (SARIF, HIGH+CRITICAL)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ inputs.service }}

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom-${{ inputs.service }}.spdx.json
          artifact-name: sbom-${{ inputs.service }}.spdx.json

      - name: Log in to Harbor
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push (rebuilt from the build cache)
        if: inputs.push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
        with:
          cosign-release: v2.6.5   # v2 CLI: key-based signing without Rekor upload (see Kyverno policy)

      - name: Sign image and attest SBOM (cosign)
        if: inputs.push
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ inputs.service }}.spdx.json
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            # Private signing (air-gapped friendly): no upload to the public Rekor transparency log.
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$REF"
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --type spdxjson --predicate "$SBOM" "$REF"
          else
            echo "::warning::COSIGN_PRIVATE_KEY is not set - falling back to keyless (GitHub OIDC) signing"
            cosign sign --yes "$REF"
            cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"
          fi
          echo "Signed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
