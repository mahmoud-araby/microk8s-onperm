# Secrets for Argo CD, sourced from Vault (ClusterSecretStore "vault-backend", KV v2 mount "secret").
#   secret/platform/argocd:
#     oidc-client-secret   Keycloak client "argocd" (realm platform)
#     slack-token          Slack bot token (chat:write)
#     smtp-username / smtp-password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd     # required so argocd-cm can reference $argocd-oidc:clientSecret
  data:
    - secretKey: clientSecret
      remoteRef:
        key: platform/argocd
        property: oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: slack-token
      remoteRef:
        key: platform/argocd
        property: slack-token
    - secretKey: email-username
      remoteRef:
        key: platform/argocd
        property: smtp-username
    - secretKey: email-password
      remoteRef:
        key: platform/argocd
        property: smtp-password
---
# Public internal CA certificate (published to Vault by core/external-secrets PushSecret "internal-ca-public"),
# mounted by argocd-server to verify https://keycloak.ops.example.local.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: internal-ca-bundle
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: internal-ca-bundle
    creationPolicy: Owner
  data:
    - secretKey: internal-ca.crt
      remoteRef:
        key: platform/internal-ca-public
        property: ca.crt
