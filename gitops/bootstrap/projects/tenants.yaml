# Project "tenants": tenant landing zones rendered by charts/tenant (one Application "tenant-<name>" per
# gitops/tenants/<name>/tenant.yaml, generated by gitops/apps/applicationsets/tenants.yaml, wave 10).
# The "shared" landing zone owns namespace shared-services (+ its quota / limit range).
#
# Guard rails:
# - Cluster-scoped kinds allowed: Namespace (tenant-<name>) and PersistentVolume (static CSI S3 bucket mounts,
#   driver ru.yandex.s3.csi, named <tenant>-<name>; docs/storage.md "Static bucket mount (exact spec)").
# - Namespaced kinds are whitelisted: a tenant landing zone may create quotas, RBAC, network/mesh policy,
#   ExternalSecrets, Kong consumers and the per-tenant data CRs (CNPG Database + role Job, Strimzi
#   KafkaTopic/KafkaUser, RabbitMQ Vhost/User/Permission/...) inside data-postgres / data-kafka /
#   data-rabbitmq - but never Deployments/StatefulSets there. In namespace minio: the per-tenant bucket/user
#   provisioning Jobs (Argo CD hooks, + their ExternalSecret) that use Secret minio/minio-provisioner-credentials.
#   Extend this list when charts/tenant renders a new kind.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Tenant landing zones (namespace, quotas, RBAC, network policies, data CRs)
  sourceRepos:
    - https://github.com/mahmoud-araby/microk8s-onperm.git
    - harbor.ops.example.local/charts
  destinations:
    - {server: https://kubernetes.default.svc, namespace: 'tenant-*'}
    - {server: https://kubernetes.default.svc, namespace: shared-services}
    - {server: https://kubernetes.default.svc, namespace: data-postgres}
    - {server: https://kubernetes.default.svc, namespace: data-kafka}
    - {server: https://kubernetes.default.svc, namespace: data-rabbitmq}
    - {server: https://kubernetes.default.svc, namespace: minio}             # bucket/user provisioning Jobs only
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: '', kind: PersistentVolume}                     # static S3 bucket mounts (csi-s3)
  namespaceResourceWhitelist:
    - {group: '', kind: ResourceQuota}
    - {group: '', kind: LimitRange}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: ConfigMap}
    - {group: '', kind: Secret}
    - {group: '', kind: PersistentVolumeClaim}                # claims bound to the static S3 PVs
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: batch, kind: Job}                               # e.g. DB role/grant jobs in data-postgres
    - {group: external-secrets.io, kind: SecretStore}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: generators.external-secrets.io, kind: Password}
    - {group: postgresql.cnpg.io, kind: Database}
    - {group: kafka.strimzi.io, kind: KafkaTopic}
    - {group: kafka.strimzi.io, kind: KafkaUser}
    - {group: rabbitmq.com, kind: Vhost}
    - {group: rabbitmq.com, kind: User}
    - {group: rabbitmq.com, kind: Permission}
    - {group: rabbitmq.com, kind: Policy}
    - {group: rabbitmq.com, kind: Queue}
    - {group: rabbitmq.com, kind: Exchange}
    - {group: rabbitmq.com, kind: Binding}
    - {group: security.istio.io, kind: PeerAuthentication}
    - {group: security.istio.io, kind: AuthorizationPolicy}
    - {group: security.istio.io, kind: RequestAuthentication}
    - {group: networking.istio.io, kind: Sidecar}
    - {group: telemetry.istio.io, kind: Telemetry}
    - {group: monitoring.coreos.com, kind: PrometheusRule}
    - {group: keda.sh, kind: TriggerAuthentication}
    - {group: configuration.konghq.com, kind: KongConsumer}   # per-tenant JWT issuer consumer
    - {group: configuration.konghq.com, kind: KongPlugin}
  orphanedResources:
    warn: true
    ignore:
      - {kind: Secret}
      - {kind: ConfigMap, name: kube-root-ca.crt}
      - {kind: ConfigMap, name: istio-ca-root-cert}
      - {group: networking.k8s.io, kind: NetworkPolicy, name: 'kyverno-*'}   # generated by Kyverno
  roles:
    - name: platform-admin
      groups: [platform-admins]
      policies:
        - p, proj:tenants:platform-admin, applications, *, tenants/*, allow
        - p, proj:tenants:platform-admin, logs, get, tenants/*, allow
    # Tenant admins get READ-ONLY access to their own landing zone (quotas/RBAC are platform-owned).
    # One role per tenant; added by the tenant onboarding MR (same MR that adds gitops/tenants/<tenant>/).
    - name: tenant-acme-readonly
      groups: [acme-admins, acme-devs]
      policies:
        - p, proj:tenants:tenant-acme-readonly, applications, get, tenants/tenant-acme*, allow
    - name: tenant-globex-readonly
      groups: [globex-admins, globex-devs]
      policies:
        - p, proj:tenants:tenant-globex-readonly, applications, get, tenants/tenant-globex*, allow
