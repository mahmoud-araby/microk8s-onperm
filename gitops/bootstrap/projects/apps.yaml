# Project "apps": service releases (charts/microservice, charts/frontend) generated by
# gitops/apps/applicationsets/services.yaml (Applications "<tenant>-<service>-<version>", wave 20).
# Allowed: everything the charts render (Rollout, AnalysisTemplate, Deployment, Service, Istio VS/DR/
# AuthorizationPolicy, KongPlugin, Ingress, HPA, KEDA ScaledObject/TriggerAuthentication, ServiceMonitor,
# PrometheusRule, ExternalSecret, NetworkPolicy, PDB ...) minus the blacklist below. Workloads may only land in tenant-* namespaces and shared-services;
# the only cluster-scoped kind is Namespace. Quotas / limit ranges / mesh-wide mTLS mode belong to the
# tenant landing zone (project "tenants") and are blacklisted here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Tenant and shared microservices / frontends
  sourceRepos:
    - https://github.com/mahmoud-araby/microk8s-onperm.git
    - harbor.ops.example.local/charts
  destinations:
    - {server: https://kubernetes.default.svc, namespace: 'tenant-*'}
    - {server: https://kubernetes.default.svc, namespace: shared-services}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
  namespaceResourceBlacklist:
    - {group: '', kind: ResourceQuota}
    - {group: '', kind: LimitRange}
    - {group: security.istio.io, kind: PeerAuthentication}
    - {group: networking.istio.io, kind: Gateway}          # only platform gateways (istio-internal/internal-gateway)
    - {group: networking.istio.io, kind: ServiceEntry}     # egress is platform-controlled (REGISTRY_ONLY mesh)
    - {group: networking.istio.io, kind: EnvoyFilter}
    - {group: networking.istio.io, kind: WorkloadEntry}
  orphanedResources:
    warn: true
    ignore:
      - {kind: Secret}
      - {kind: ConfigMap, name: kube-root-ca.crt}
      - {kind: ConfigMap, name: istio-ca-root-cert}
      - {group: networking.k8s.io, kind: NetworkPolicy, name: 'kyverno-*'}
      - {group: argoproj.io, kind: AnalysisRun}
      - {group: apps, kind: ReplicaSet}
  roles:
    - name: platform-admin
      groups: [platform-admins]
      policies:
        - p, proj:apps:platform-admin, applications, *, apps/*, allow
        - p, proj:apps:platform-admin, logs, get, apps/*, allow
    # Per-tenant roles (OIDC groups from the Keycloak "platform"/tenant realms, claim "groups").
    # Tenant admins: sync / rollback / promote & abort Rollouts of their own releases; devs: read + logs.
    # Application names generated by the ApplicationSets start with "<tenant>-" (e.g. acme-orders-v1).
    - name: tenant-acme-admin
      groups: [acme-admins]
      policies:
        - p, proj:apps:tenant-acme-admin, applications, get, apps/acme-*, allow
        - p, proj:apps:tenant-acme-admin, applications, sync, apps/acme-*, allow
        - p, proj:apps:tenant-acme-admin, applications, action/argoproj.io/Rollout/*, apps/acme-*, allow
        - p, proj:apps:tenant-acme-admin, logs, get, apps/acme-*, allow
    - name: tenant-acme-dev
      groups: [acme-devs, acme-viewers]
      policies:
        - p, proj:apps:tenant-acme-dev, applications, get, apps/acme-*, allow
        - p, proj:apps:tenant-acme-dev, logs, get, apps/acme-*, allow
    - name: tenant-globex-admin
      groups: [globex-admins]
      policies:
        - p, proj:apps:tenant-globex-admin, applications, get, apps/globex-*, allow
        - p, proj:apps:tenant-globex-admin, applications, sync, apps/globex-*, allow
        - p, proj:apps:tenant-globex-admin, applications, action/argoproj.io/Rollout/*, apps/globex-*, allow
        - p, proj:apps:tenant-globex-admin, logs, get, apps/globex-*, allow
    - name: tenant-globex-dev
      groups: [globex-devs, globex-viewers]
      policies:
        - p, proj:apps:tenant-globex-dev, applications, get, apps/globex-*, allow
        - p, proj:apps:tenant-globex-dev, logs, get, apps/globex-*, allow
