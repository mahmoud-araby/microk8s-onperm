# Keycloak (official image via codecentric/keycloakx), 3 replicas, Infinispan cluster via JGroups DNS_PING,
# PostgreSQL = CNPG pg-main (db "keycloak") with credentials from Vault. Realm import in ./manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: platform-core
    platform.example.com/category: core
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.3.2 # pin: verify latest before upgrade (Keycloak 26.7.4)
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/gitops/platform/core/keycloak/values.yaml
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      path: gitops/platform/core/keycloak/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
