# Keycloak secrets from Vault  secret/platform/keycloak:
#   db-password                       role/db "keycloak" on pg-main (managed role in gitops/platform/data/postgres,
#                                     which reads the same Vault key - single source of truth)
#   admin-username, admin-password    temporary bootstrap admin (disable after SSO admin exists)
#   client-argocd, client-grafana, client-harbor, client-vault, client-kiali   OIDC client secrets
#   (the same values are read by the consuming tools from secret/platform/<tool>)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: keycloak-db
    creationPolicy: Owner
    template:
      data:
        username: keycloak
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: platform/keycloak, property: db-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: keycloak-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: {key: platform/keycloak, property: admin-username}
    - secretKey: password
      remoteRef: {key: platform/keycloak, property: admin-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: keycloak-client-secrets
    creationPolicy: Owner
  data:
    - {secretKey: argocd, remoteRef: {key: platform/keycloak, property: client-argocd}}
    - {secretKey: grafana, remoteRef: {key: platform/keycloak, property: client-grafana}}
    - {secretKey: harbor, remoteRef: {key: platform/keycloak, property: client-harbor}}
    - {secretKey: vault, remoteRef: {key: platform/keycloak, property: client-vault}}
    - {secretKey: kiali, remoteRef: {key: platform/keycloak, property: client-kiali}}
