# nfs-rwx: ReadWriteMany shared file system on the on-prem NFS server (docs/conventions.md "Storage classes").
# Each PVC gets its own directory <export>/<namespace>/<pvc-name>. reclaimPolicy Retain + onDelete retain:
# deleting a PVC never deletes data (clean up on the NFS server after the retention period).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-rwx
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: nfs.csi.k8s.io
parameters:
  server: nfs.storage.example.local
  share: /exports/k8s
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  onDelete: retain
  mountPermissions: "0"
  # csi.storage.k8s.io/provisioner-secret-*: only needed for Kerberos / mountOptions from a Secret
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true          # quota is enforced on the NFS server, not by the driver
mountOptions:
  - nfsvers=4.1
  - hard
  - noatime
  - timeo=600
  - retrans=3
