# Platform-core namespaces. Component Applications also use CreateNamespace=true (no-op once these exist).
# Data / observability / tenant namespaces - and shared-services, owned by the "shared" tenant landing zone
# (charts/tenant, gitops/tenants/shared) - are owned by their own Applications and NOT declared here.
# Pod Security: enforce as listed, always warn+audit at "restricted" to surface drift.
# istio-cni is installed, so meshed namespaces do not need NET_ADMIN (no privileged istio-init).
# NEVER label the gateway namespaces istio-injection=disabled: gateway pods are injected via the
# object selector (sidecar.istio.io/inject=true) which requires the namespace label to be absent.
# GitOps (not meshed; TLS terminates at istio-internal)
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    kubernetes.io/metadata.name: argocd
    platform.example.com/category: core
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
