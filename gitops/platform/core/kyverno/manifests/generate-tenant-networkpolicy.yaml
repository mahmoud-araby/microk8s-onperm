apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-tenant-default-networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Default NetworkPolicy for tenant namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Safety net: every new tenant-* namespace immediately gets an ingress default-deny baseline that only
      admits traffic from the same namespace, the gateways (kong, istio-internal), istio-system and
      monitoring. charts/tenant adds the complete policy set (incl. egress); NetworkPolicies are additive,
      so this baseline never widens what the tenant chart allows beyond these sources.
spec:
  rules:
    - name: default-ingress-baseline
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: ["tenant-*"]
      generate:
        generateExisting: true           # also back-fill namespaces that existed before the policy
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: kyverno-default-ingress-baseline
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
          spec:
            podSelector: {}
            policyTypes: [Ingress]
            ingress:
              - from:
                  - podSelector: {}
              - from:
                  - namespaceSelector:
                      matchExpressions:
                        - key: kubernetes.io/metadata.name
                          operator: In
                          values: [kong, istio-internal, istio-system, monitoring]
