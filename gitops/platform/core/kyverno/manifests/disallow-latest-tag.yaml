apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Images must be pinned to an immutable version tag (or digest); ":latest" and untagged images are
      rejected so that rollbacks and Argo Rollouts canaries are deterministic.
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["tenant-*", "shared-services"]
      validate:
        failureAction: Enforce
        message: "An image tag is required."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                all:
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@') }}"
                    operator: Equals
                    value: false
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["tenant-*", "shared-services"]
      validate:
        failureAction: Enforce
        message: "Using a mutable image tag e.g. 'latest' is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
