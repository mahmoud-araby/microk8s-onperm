# Istio INTERNAL gateway (MetalLB internal-pool): *.internal.example.local and *.ops.example.local,
# east-west / hybrid / partner VPN traffic and the istiod expose for VM mesh expansion.
# Gateway resource "istio-internal/internal-gateway" lives in ./manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-internal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: platform-core
    platform.example.com/category: core
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-internal
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: gateway
      targetRevision: 1.30.5 # pin: verify latest before upgrade
      helm:
        releaseName: istio-internal-gateway
        valueFiles:
          - $values/gitops/platform/core/istio-internal/values.yaml
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      path: gitops/platform/core/istio-internal/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
