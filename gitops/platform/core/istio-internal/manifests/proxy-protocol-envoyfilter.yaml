# PROXY protocol on the internal gateway - ONLY for the edge load balancers in lb_mode: l4
# (docs/load-balancing.md). Preferred: the gatewayTopology.proxyProtocol pod annotation described in
# ../values.yaml. This EnvoyFilter is the explicit alternative that limits PROXY protocol to the
# :80/:443 listeners (container ports 8080/8443), so VM mesh expansion on 15012/15443 keeps working
# without a PROXY header. Uncomment together with lb_mode: l4; with l7 it would break every request.
#
