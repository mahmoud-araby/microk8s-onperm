# istio/gateway - INTERNAL gateway (namespace istio-internal, release istio-internal-gateway).
# Private VIP from MetalLB internal-pool. Serves *.internal.example.local and *.ops.example.local
# (Gateway "istio-internal/internal-gateway" in ./manifests), east-west/hybrid traffic and the istiod
# endpoints used by on-prem VMs joining the mesh (ports 15012/15017).
labels:
  app: istio-internal-gateway
  istio: internal-gateway

# Client IP behind the edge load balancer (ansible role `loadbalancer`, docs/load-balancing.md).
# lb_mode l7 (default): HAProxy on the internal VIP terminates TLS and appends the client IP to
# X-Forwarded-For -> trust exactly ONE proxy hop, so Envoy's x-envoy-external-address, access logs and
# AuthorizationPolicy remoteIpBlocks see the real client. (Merged with the chart's default pod annotations.)
# NOTE: a client that bypasses the LB and talks to the MetalLB VIP directly could forge one XFF hop;
# acceptable on the internal VLAN, or restrict with service.loadBalancerSourceRanges to the LB subnet.
# lb_mode l4 (TLS passthrough + PROXY protocol v2): replace the annotation with
#   proxy.istio.io/config: |
#     gatewayTopology:
#       numTrustedProxies: 0
#       proxyProtocol: {}
# (or the EnvoyFilter in manifests/ comments, docs/load-balancing.md) - every connection must then carry
# a PROXY header, including VM mesh-expansion traffic on 15012/15443 -> keep those on a separate VIP.
podAnnotations:
  proxy.istio.io/config: |
    gatewayTopology:
      numTrustedProxies: 1

service:
  type: LoadBalancer
  annotations:
    metallb.io/address-pool: internal-pool
    # Pin the VIP the edge load balancers forward to (= lb_backend_istio_internal_vip):
    metallb.io/loadBalancerIPs: 10.10.100.10
  # Local = no SNAT: the gateway sees the LB address (l7) / PROXY header (l4) or the direct client.
  externalTrafficPolicy: Local
  # loadBalancerSourceRanges: ["10.10.20.0/24"]
  ports:
    - {name: status-port, port: 15021, protocol: TCP, targetPort: 15021}
    - {name: http2, port: 80, protocol: TCP, targetPort: 80}
    - {name: https, port: 443, protocol: TCP, targetPort: 443}
    - {name: tls-istiod, port: 15012, protocol: TCP, targetPort: 15012}      # VM mesh expansion: XDS/CA
    - {name: tls-webhook, port: 15017, protocol: TCP, targetPort: 15017}
    - {name: tls-mesh, port: 15443, protocol: TCP, targetPort: 15443}        # mTLS AUTO_PASSTHROUGH (VMs, multi-network)

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

resources:
  requests: {cpu: 500m, memory: 256Mi}
  limits: {memory: 1Gi}

priorityClassName: platform-critical

nodeSelector:
  workload-tier: edge
tolerations:
  - key: workload-tier
    operator: Equal
    value: edge
    effect: NoSchedule

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: istio-internal-gateway

terminationGracePeriodSeconds: 60
