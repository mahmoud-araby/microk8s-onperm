# Credentials of the MinIO user "csi-s3" (policy: read/write on bucket platform-pvc only), created by the
# minio app's bootstrap Job (gitops/platform/core/minio/manifests/50-bootstrap-job.yaml).
# Vault secret/platform/csi-s3 keys access-key, secret-key.
# Secret keys are the ones the driver reads (pkg/s3/client.go NewClientFromSecret):
# accessKeyID, secretAccessKey, endpoint, region (optional).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: csi-s3-platform
  namespace: csi-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: csi-s3-platform
    creationPolicy: Owner
    template:
      data:
        accessKeyID: "{{ .accessKey }}"
        secretAccessKey: "{{ .secretKey }}"
        endpoint: https://minio.minio.svc.cluster.local
        region: us-east-1
  data:
    - secretKey: accessKey
      remoteRef: {key: platform/csi-s3, property: access-key}
    - secretKey: secretKey
      remoteRef: {key: platform/csi-s3, property: secret-key}
---
# Public internal CA certificate (written to Vault by the PushSecret in core/external-secrets). Mounted into the
# driver containers and added to the Go trust store via SSL_CERT_DIR so GeeseFS / minio-go verify MinIO's
# certificate (issued by ClusterIssuer internal-ca).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: internal-ca
  namespace: csi-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: internal-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: {key: platform/internal-ca-public, property: ca.crt}
