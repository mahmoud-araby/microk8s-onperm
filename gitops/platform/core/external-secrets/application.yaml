# External Secrets Operator + ClusterSecretStore "vault-backend" (Vault KV v2 mount "secret",
# Kubernetes auth role "external-secrets").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/part-of: platform-core
    platform.example.com/category: core
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0 # pin: verify latest before upgrade
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/gitops/platform/core/external-secrets/values.yaml
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      path: gitops/platform/core/external-secrets/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
