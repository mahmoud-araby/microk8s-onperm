# ClusterSecretStore "vault-backend" (docs/conventions.md): Vault KV v2 mount "secret".
# Paths: secret/platform/<component>, secret/tenants/<tenant>/<service>.
# Consumers: platform components, charts/tenant (data-* credentials) and charts/microservice (default store
# of externalSecret.storeRef). charts/tenant additionally creates a namespaced SecretStore "vault-tenant"
# (Vault role tenant-<name>, policy limited to secret/tenants/<name>/*) for stronger isolation; once all
# releases use it, restrict this store with spec.conditions (example at the bottom).
#
# Vault side (one-time, Ansible):
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc
#   vault policy write external-secrets - <<< 'path "secret/data/platform/*" { capabilities = ["read"] }
#                                            path "secret/data/tenants/*"  { capabilities = ["read"] }
#                                            path "secret/metadata/*"      { capabilities = ["read","list"] }
#                                            path "secret/data/platform/internal-ca-public" { capabilities = ["create","update","read"] }'
#   vault write auth/kubernetes/role/external-secrets bound_service_account_names=external-secrets \
#         bound_service_account_namespaces=external-secrets policies=external-secrets ttl=1h
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"        # after the ESO webhook is ready
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: vault-server-tls
        namespace: vault
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  refreshInterval: 300
  # Hardening (after tenants moved to their SecretStore "vault-tenant"):
  # conditions:
  #   - namespaceSelector:
  #       matchExpressions:
  #         - {key: platform.example.com/category, operator: In, values: [core, data, observability]}
