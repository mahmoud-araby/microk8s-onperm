# PushSecret example: publish the PUBLIC part of the internal CA to Vault (secret/platform/internal-ca-public)
# so VMs, CI runners and workstations can fetch the trust anchor (never the private key).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: internal-ca-public
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: vault-backend
  selector:
    secret:
      name: internal-ca-keypair
  data:
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: platform/internal-ca-public
          property: ca.crt
