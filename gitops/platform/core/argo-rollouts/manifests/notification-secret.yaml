# Slack token for Argo Rollouts notifications (Vault secret/platform/argo-rollouts, property slack-token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-rollouts-notification-secret
  namespace: argo-rollouts
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: argo-rollouts-notification-secret
    creationPolicy: Owner
  data:
    - secretKey: slack-token
      remoteRef: {key: platform/argo-rollouts, property: slack-token}
