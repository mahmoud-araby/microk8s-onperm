# Vault server certificate (API + raft cluster traffic), issued by internal-ca.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"      # before the StatefulSet (pods mount the secret)
spec:
  secretName: vault-server-tls
  commonName: vault.vault.svc
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    - vault-standby.vault.svc
    - vault-internal
    - "*.vault-internal"
    - "*.vault-internal.vault.svc"
    - "*.vault-internal.vault.svc.cluster.local"
    - vault.ops.example.local
  ipAddresses:
    - 127.0.0.1
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [server auth, client auth, digital signature, key encipherment]
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
