# S3 credentials for the Longhorn backup target (Vault: secret/platform/longhorn
# keys s3-access-key, s3-secret-key, s3-endpoint, s3-ca-cert).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-s3
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: longhorn-backup-s3
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
        AWS_ENDPOINTS: "{{ .endpoint }}"              # e.g. https://minio.storage.example.local:9000
        AWS_CERT: "{{ .caCert }}"                     # CA of the MinIO endpoint (internal-ca)
        VIRTUAL_HOSTED_STYLE: "false"
  data:
    - secretKey: accessKey
      remoteRef: {key: platform/longhorn, property: s3-access-key}
    - secretKey: secretKey
      remoteRef: {key: platform/longhorn, property: s3-secret-key}
    - secretKey: endpoint
      remoteRef: {key: platform/longhorn, property: s3-endpoint}
    - secretKey: caCert
      remoteRef: {key: platform/longhorn, property: s3-ca-cert}
