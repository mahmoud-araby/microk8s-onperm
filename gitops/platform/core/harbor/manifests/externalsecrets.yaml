# Harbor secrets from Vault:
#   secret/platform/harbor : admin-password, secret-key (16 chars), db-password, oidc-client-secret
#   secret/platform/redis  : password   (owned by gitops/platform/data/redis)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target: {name: harbor-admin, creationPolicy: Owner}
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef: {key: platform/harbor, property: admin-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secret-key
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target: {name: harbor-secret-key, creationPolicy: Owner}
  data:
    - secretKey: secretKey
      remoteRef: {key: platform/harbor, property: secret-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target: {name: harbor-db, creationPolicy: Owner}
  data:
    - secretKey: password
      remoteRef: {key: platform/harbor, property: db-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-redis
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target: {name: harbor-redis, creationPolicy: Owner}
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef: {key: platform/redis, property: password}
