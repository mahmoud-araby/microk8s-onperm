# S3 (MinIO) credentials for Velero, Vault secret/platform/velero (s3-access-key, s3-secret-key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKey }}
          aws_secret_access_key={{ .secretKey }}
  data:
    - secretKey: accessKey
      remoteRef: {key: platform/velero, property: s3-access-key}
    - secretKey: secretKey
      remoteRef: {key: platform/velero, property: s3-secret-key}
