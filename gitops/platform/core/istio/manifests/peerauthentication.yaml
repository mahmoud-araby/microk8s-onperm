# Mesh-wide mTLS: every sidecar-injected workload only accepts mutual TLS.
# Non-meshed callers (e.g. Prometheus scraping pod ports directly) must either be meshed or scrape the
# merged metrics endpoint on :15020 (enablePrometheusMerge), which is not subject to mTLS.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
