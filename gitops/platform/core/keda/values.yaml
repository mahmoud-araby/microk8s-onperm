# KEDA (kedacore/keda chart): event-driven autoscaling for charts/microservice (autoscaling.keda):
# Kafka consumer lag, RabbitMQ queue length, Prometheus queries, cron.
# KEDA registers the external.metrics.k8s.io API; the MicroK8s metrics-server keeps metrics.k8s.io.
crds:
  install: true

operator:
  replicaCount: 2                # leader election, hot standby
metricsServer:
  replicaCount: 2
webhooks:
  enabled: true
  replicaCount: 2

podDisruptionBudget:
  operator:
    minAvailable: 1
  metricServer:
    minAvailable: 1
  webhooks:
    minAvailable: 1

priorityClassName: platform-critical

nodeSelector:
  workload-tier: platform

resources:
  operator:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 1Gi}
  metricServer:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 1Gi}
  webhooks:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

logging:
  operator:
    format: json
  metricServer:
    zapEncoder: json
  webhooks:
    format: json

prometheus:
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
  webhooks:
    enabled: true
    serviceMonitor:
      enabled: true
