# istio/gateway - PUBLIC ingress gateway (namespace istio-ingress, release istio-ingressgateway).
# Only for public non-API traffic when explicitly needed; APIs/frontends are exposed by Kong.
labels:
  app: istio-ingressgateway
  istio: ingressgateway

# Client IP: this PUBLIC gateway is reached directly on its MetalLB VIP (the edge load balancers only
# forward the public VIP to Kong), so X-Forwarded-For is NOT trusted by default. If you route it through
# the edge LB (docs/load-balancing.md), trust exactly one hop in l7 mode:
# podAnnotations:
#   proxy.istio.io/config: |
#     gatewayTopology:
#       numTrustedProxies: 1
# or, in l4 mode (PROXY protocol v2):  gatewayTopology: {proxyProtocol: {}}
service:
  type: LoadBalancer
  annotations:
    metallb.io/address-pool: public-pool
  externalTrafficPolicy: Local          # preserve client source IP (required for any of the above)
  ports:
    - {name: status-port, port: 15021, protocol: TCP, targetPort: 15021}
    - {name: http2, port: 80, protocol: TCP, targetPort: 80}
    - {name: https, port: 443, protocol: TCP, targetPort: 443}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

resources:
  requests: {cpu: 500m, memory: 256Mi}
  limits: {memory: 1Gi}

priorityClassName: platform-critical

nodeSelector:
  workload-tier: edge
tolerations:
  - key: workload-tier
    operator: Equal
    value: edge
    effect: NoSchedule

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: istio-ingressgateway

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: istio-ingressgateway

terminationGracePeriodSeconds: 60
