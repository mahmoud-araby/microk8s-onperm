# Prometheus scrape of the MinIO v2 metrics endpoints over TLS (MINIO_PROMETHEUS_AUTH_TYPE=public, so no
# bearer token). Service "minio" (created by the operator) has port https-minio 443 -> 9000; the
# endpoints resolve to the 4 MinIO pods, so node metrics come from every server.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: platform-core
spec:
  jobLabel: app.kubernetes.io/name    # job="minio" (matches MINIO_PROMETHEUS_JOB_ID for the console graphs)
  selector:
    matchLabels:                      # tenant.serviceMetadata.minioServiceLabels (values.yaml)
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: s3-api
  endpoints:
    # cluster-wide metrics: one target is enough, but every pod answers; dedupe with max()/sum() by server.
    - port: https-minio
      scheme: https
      path: /minio/v2/metrics/cluster
      interval: 60s
      scrapeTimeout: 30s
      tlsConfig:
        serverName: minio.minio.svc.cluster.local
        ca:
          secret:
            name: minio-tls
            key: ca.crt
    - port: https-minio
      scheme: https
      path: /minio/v2/metrics/node
      interval: 30s
      scrapeTimeout: 20s
      tlsConfig:
        serverName: minio.minio.svc.cluster.local
        ca:
          secret:
            name: minio-tls
            key: ca.crt
    - port: https-minio
      scheme: https
      path: /minio/v2/metrics/bucket
      interval: 60s
      scrapeTimeout: 30s
      tlsConfig:
        serverName: minio.minio.svc.cluster.local
        ca:
          secret:
            name: minio-tls
            key: ca.crt
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minio
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: platform-core
spec:
  groups:
    - name: minio.minio
      rules:
        - alert: MinioNodeOffline
          expr: max(minio_cluster_nodes_offline_total{namespace="minio"}) > 0
          for: 5m
          labels: {severity: warning, team: platform}
          annotations:
            summary: "MinIO: {{ $value }} server(s) offline - erasure set has no more node-level redundancy"
        - alert: MinioDrivesOffline
          expr: max(minio_cluster_drive_offline_total{namespace="minio"}) > 0
          for: 5m
          labels: {severity: warning, team: platform}
          annotations:
            summary: "MinIO: {{ $value }} drive(s) offline (EC:4 tolerates 4 per erasure set)"
        - alert: MinioWriteQuorumAtRisk
          expr: max(minio_cluster_drive_offline_total{namespace="minio"}) >= 4
          for: 1m
          labels: {severity: critical, team: platform}
          annotations:
            summary: "MinIO: {{ $value }} drives offline - one more failure stops writes"
        - alert: MinioCapacityLow
          expr: |
            max(minio_cluster_capacity_usable_free_bytes{namespace="minio"})
              / max(minio_cluster_capacity_usable_total_bytes{namespace="minio"}) < 0.20
          for: 30m
          labels: {severity: warning, team: platform}
          annotations:
            summary: "MinIO usable capacity below 20 % free"
        - alert: MinioCapacityCritical
          expr: |
            max(minio_cluster_capacity_usable_free_bytes{namespace="minio"})
              / max(minio_cluster_capacity_usable_total_bytes{namespace="minio"}) < 0.10
          for: 10m
          labels: {severity: critical, team: platform}
          annotations:
            summary: "MinIO usable capacity below 10 % free"
        - alert: MinioScrapeDown
          expr: absent(up{job="minio", namespace="minio"} == 1)
          for: 10m
          labels: {severity: warning, team: platform}
          annotations:
            summary: "No MinIO metrics target is up"
