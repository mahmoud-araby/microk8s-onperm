# Vault secret/platform/minio: root-user, root-password (in-cluster Tenant "minio").
# Vault secret/platform/csi-s3: access-key, secret-key (MinIO user "csi-s3", created by 50-bootstrap-job.yaml).
#
# 1) Tenant configuration: the operator reads key config.env ("export VAR=value" lines, the format the
#    tenant chart itself renders in templates/tenant-configuration.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-env-configuration
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: minio-env-configuration
    creationPolicy: Owner
    template:
      data:
        config.env: |
          export MINIO_ROOT_USER="{{ .rootUser }}"
          export MINIO_ROOT_PASSWORD="{{ .rootPassword }}"
  data:
    - secretKey: rootUser
      remoteRef: {key: platform/minio, property: root-user}
    - secretKey: rootPassword
      remoteRef: {key: platform/minio, property: root-password}
---
# 2) Admin credentials for provisioning Jobs running in namespace minio: the bootstrap Job below and the
#    per-tenant bucket/user Jobs rendered by charts/tenant (contract in docs/storage.md "Provisioning Jobs").
#    MC_HOST_minio lets `mc` use alias "minio" without `mc alias set`. root-password must be URL-safe
#    (it is query-escaped here; generate it alphanumeric).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-provisioner-credentials
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: minio-provisioner-credentials
    creationPolicy: Owner
    template:
      data:
        MINIO_ROOT_USER: "{{ .rootUser }}"
        MINIO_ROOT_PASSWORD: "{{ .rootPassword }}"
        MC_HOST_minio: "https://{{ .rootUser | urlquery }}:{{ .rootPassword | urlquery }}@minio.minio.svc.cluster.local"
  data:
    - secretKey: rootUser
      remoteRef: {key: platform/minio, property: root-user}
    - secretKey: rootPassword
      remoteRef: {key: platform/minio, property: root-password}
---
# 3) Credentials of the platform user "csi-s3" (bucket platform-pvc), created/updated by the bootstrap Job.
#    The same Vault keys are read by csi-s3/manifests/00-externalsecrets.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-user-csi-s3
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: minio-user-csi-s3
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY: "{{ .accessKey }}"
        SECRET_KEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef: {key: platform/csi-s3, property: access-key}
    - secretKey: secretKey
      remoteRef: {key: platform/csi-s3, property: secret-key}
