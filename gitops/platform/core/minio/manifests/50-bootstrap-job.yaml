# Bootstrap of the platform side of the in-cluster MinIO (idempotent, Argo CD PostSync hook after every sync):
#   - bucket defaults: versioning + lifecycle on platform-app-assets and shared-files
#     (noncurrent versions expire after 30 days, expired delete markers are removed);
#     platform-pvc: no versioning (FUSE rewrites would multiply versions), no lifecycle.
#   - MinIO user "csi-s3" (Vault secret/platform/csi-s3) with policy csi-s3-platform-pvc (bucket platform-pvc only).
# Per-tenant buckets/users are NOT created here: charts/tenant renders its own Jobs (docs/storage.md).
# Image: mc built from source by CI (docs/storage.md "Images"), must contain /bin/sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-bootstrap
  namespace: minio
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/part-of: platform-core
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    export MC_CONFIG_DIR=/tmp/.mc
    mkdir -p "$MC_CONFIG_DIR/certs/CAs"
    cp /tls/ca.crt "$MC_CONFIG_DIR/certs/CAs/internal-ca.crt"
    # alias "minio" comes from env MC_HOST_minio (Secret minio-provisioner-credentials)
    echo "waiting for MinIO write quorum..."
    i=0
    until mc ready minio >/dev/null 2>&1; do
      i=$((i+1)); [ "$i" -gt 90 ] && { echo "MinIO not ready after 15 min"; exit 1; }
      sleep 10
    done
    for b in platform-app-assets shared-files; do
      mc mb --ignore-existing "minio/$b"
      mc version enable "minio/$b"
      mc ilm rule import "minio/$b" < /config/lifecycle-versioned.json
    done
    mc mb --ignore-existing minio/platform-pvc
    mc admin policy create minio csi-s3-platform-pvc /config/policy-csi-s3.json
    mc admin user add minio "$CSI_S3_ACCESS_KEY" "$CSI_S3_SECRET_KEY"
    if ! mc admin user info minio "$CSI_S3_ACCESS_KEY" | grep -q "csi-s3-platform-pvc"; then
      mc admin policy attach minio csi-s3-platform-pvc --user "$CSI_S3_ACCESS_KEY"
    fi
    echo "bootstrap done"
  # S3 lifecycle configuration (JSON form of minio-go pkg/lifecycle, as read by `mc ilm rule import`).
  lifecycle-versioned.json: |
    {
      "Rules": [
        {
          "ID": "noncurrent-versions-30d",
          "Status": "Enabled",
          "Filter": {},
          "NoncurrentVersionExpiration": {"NoncurrentDays": 30}
        },
        {
          "ID": "expired-delete-markers",
          "Status": "Enabled",
          "Filter": {},
          "Expiration": {"ExpiredObjectDeleteMarker": true}
        }
      ]
    }
  policy-csi-s3.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::platform-pvc"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
          "Resource": ["arn:aws:s3:::platform-pvc/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/part-of: platform-core
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        workload-tier: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: harbor.ops.example.local/platform/mc:RELEASE.2025-08-13T08-35-41Z # pin: verify latest before upgrade
          command: ["/bin/sh", "/config/bootstrap.sh"]
          envFrom:
            - secretRef:
                name: minio-provisioner-credentials
          env:
            - name: CSI_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-user-csi-s3, key: ACCESS_KEY}
            - name: CSI_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: minio-user-csi-s3, key: SECRET_KEY}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: minio-bootstrap
        - name: tls
          secret:
            secretName: minio-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
