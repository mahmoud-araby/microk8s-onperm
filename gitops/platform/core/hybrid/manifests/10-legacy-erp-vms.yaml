# (a) Legacy on-prem SQL Server + ERP running on VMs in the datacenter, joined to the mesh
#     ("VM mesh expansion"): each VM runs the Istio sidecar (istio-sidecar .deb/.rpm) bootstrapped with
#     files generated by `istioctl x workload entry configure -f workloadgroup.yaml ...` and reaches istiod
#     through the internal gateway (istio-internal/istiod-gateway, ports 15012/15017).
#     Pods then call  erp-sqlserver.legacy-vms.svc.cluster.local:1433  /  erp-api.legacy-vms.svc...:8080
#     with automatic mTLS and SPIFFE identity (spiffe://cluster.local/ns/legacy-vms/sa/erp-vm).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-vm
  namespace: legacy-vms
  labels:
    app.kubernetes.io/part-of: hybrid-services
---
apiVersion: networking.istio.io/v1
kind: WorkloadGroup
metadata:
  name: erp-sqlserver
  namespace: legacy-vms
spec:
  metadata:
    labels:
      app: erp-sqlserver
      app.kubernetes.io/name: erp-sqlserver
      version: sql2019
  template:
    serviceAccount: erp-vm
    network: ""                         # same flat network via site-to-site VPN; set "onprem-dc" if NATed
    ports:
      tcp-mssql: 1433
  probe:
    periodSeconds: 10
    initialDelaySeconds: 5
    tcpSocket:
      port: 1433
---
# Static WorkloadEntries (one per VM). With auto-registration (PILOT_ENABLE_WORKLOAD_ENTRY_AUTOREGISTRATION)
# the VM sidecar creates them itself from the WorkloadGroup; static entries are kept for determinism.
apiVersion: networking.istio.io/v1
kind: WorkloadEntry
metadata:
  name: erp-sqlserver-vm01
  namespace: legacy-vms
spec:
  address: 10.20.30.11                  # placeholder: SQL Server Always-On listener node 1
  labels:
    app: erp-sqlserver
    version: sql2019
  serviceAccount: erp-vm
  locality: dc1/rack-a
  ports:
    tcp-mssql: 1433
---
apiVersion: networking.istio.io/v1
kind: WorkloadEntry
metadata:
  name: erp-sqlserver-vm02
  namespace: legacy-vms
spec:
  address: 10.20.30.12                  # placeholder: node 2 (secondary replica)
  labels:
    app: erp-sqlserver
    version: sql2019
  serviceAccount: erp-vm
  locality: dc1/rack-b
  ports:
    tcp-mssql: 1433
---
# Kubernetes Service selecting the WorkloadEntries (Istio merges pods + WorkloadEntries behind a Service
# selector), giving the VMs an ordinary cluster DNS name.
apiVersion: v1
kind: Service
metadata:
  name: erp-sqlserver
  namespace: legacy-vms
  labels:
    app: erp-sqlserver
spec:
  selector:
    app: erp-sqlserver
  ports:
    - name: tcp-mssql
      port: 1433
      targetPort: 1433
      appProtocol: tcp
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: erp-sqlserver
  namespace: legacy-vms
spec:
  host: erp-sqlserver.legacy-vms.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true
    connectionPool:
      tcp:
        maxConnections: 500             # protect the legacy DB from connection storms
        connectTimeout: 5s
        tcpKeepalive:
          time: 300s
          interval: 60s
          probes: 3
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
---
# ERP application server (SOAP/REST) on the same VMs pattern
apiVersion: networking.istio.io/v1
kind: WorkloadGroup
metadata:
  name: erp-api
  namespace: legacy-vms
spec:
  metadata:
    labels:
      app: erp-api
  template:
    serviceAccount: erp-vm
    ports:
      http: 8080
  probe:
    periodSeconds: 10
    httpGet:
      path: /health
      port: 8080
---
apiVersion: networking.istio.io/v1
kind: WorkloadEntry
metadata:
  name: erp-api-vm01
  namespace: legacy-vms
spec:
  address: 10.20.30.21                  # placeholder
  labels:
    app: erp-api
  serviceAccount: erp-vm
  ports:
    http: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: erp-api
  namespace: legacy-vms
  labels:
    app: erp-api
spec:
  selector:
    app: erp-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: erp-api
  namespace: legacy-vms
spec:
  host: erp-api.legacy-vms.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 3s
      http:
        http1MaxPendingRequests: 200
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: erp-api
  namespace: legacy-vms
spec:
  hosts:
    - erp-api.legacy-vms.svc.cluster.local
  http:
    - timeout: 15s                      # the ERP is slow; callers should use async (RabbitMQ / Micro Integrator)
      retries:
        attempts: 2
        perTryTimeout: 7s
        retryOn: connect-failure,refused-stream,unavailable,gateway-error
      route:
        - destination:
            host: erp-api.legacy-vms.svc.cluster.local
            port:
              number: 8080
---
# Only the integration layer, the pooled tier and tenant namespaces may talk to the ERP (enforced by the
# VM sidecars; Istio supports prefix matching on namespaces).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: erp-allow-callers
  namespace: legacy-vms
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["integration", "shared-services", "tenant-*"]
