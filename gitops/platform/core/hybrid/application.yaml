# Hybrid services: legacy on-prem SQL Server / ERP VMs (WorkloadGroup/WorkloadEntry mesh expansion),
# external SaaS API via the egress gateway with TLS origination, cloud-managed Kafka placeholder.
# See ./README.md for the site-to-site VPN design.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: platform-core
    platform.example.com/category: core
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-egress
  sources:
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      path: gitops/platform/core/hybrid/manifests
      directory:
        recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
