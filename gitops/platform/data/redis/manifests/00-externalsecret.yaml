# Redis password (requirepass / masterauth / Sentinel auth) from Vault secret/platform/redis.
# Keep it alphanumeric (32+ chars): it is embedded in redis.conf, sentinel.conf and haproxy.cfg.
# Clients (microservice chart REDIS_PASSWORD, Kong rate-limiting) read the same Vault key.
# Rotation: update Vault -> ESO refreshes the Secret -> `kubectl -n data-redis rollout restart
# sts/redis-node sts/redis-sentinel deploy/redis-haproxy` (see README runbook).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: redis-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: platform/redis
        property: password
