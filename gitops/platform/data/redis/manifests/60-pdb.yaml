apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-node
  labels:
    app.kubernetes.io/name: redis-node
    app.kubernetes.io/part-of: platform-data
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-node
---
# Keep Sentinel quorum (2 of 3) during drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/part-of: platform-data
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-sentinel
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-haproxy
  labels:
    app.kubernetes.io/name: redis-haproxy
    app.kubernetes.io/part-of: platform-data
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-haproxy
