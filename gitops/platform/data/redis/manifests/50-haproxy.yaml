# HAProxy master router behind Service `redis` (6379) and `redis-replicas` (6380 -> 6379).
# Stateless, 3 replicas across data hosts. Prometheus metrics on :8404/metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-haproxy
  labels:
    app.kubernetes.io/name: redis-haproxy
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: master-router
    app.kubernetes.io/part-of: platform-data
    app.kubernetes.io/version: "3.2.23"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-haproxy
        app.kubernetes.io/instance: redis
        app.kubernetes.io/component: master-router
        app.kubernetes.io/part-of: platform-data
        app.kubernetes.io/version: "3.2.23"
      annotations:
        sidecar.istio.io/inject: "false"
        platform.example.com/config-revision: "1"
    spec:
      priorityClassName: data-critical
      terminationGracePeriodSeconds: 35
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        workload-tier: data
      tolerations:
        - key: workload-tier
          operator: Equal
          value: data
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: redis-haproxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          image: haproxy:3.2.23 # pin: verify latest before upgrade (3.2 LTS)
          imagePullPolicy: IfNotPresent
          args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - name: redis-master
              containerPort: 6379
              protocol: TCP
            - name: redis-replica
              containerPort: 6380
              protocol: TCP
            - name: metrics
              containerPort: 8404
              protocol: TCP
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: redis-config
            items:
              - key: haproxy.cfg
                path: haproxy.cfg
        - name: run
          emptyDir:
            sizeLimit: 8Mi
