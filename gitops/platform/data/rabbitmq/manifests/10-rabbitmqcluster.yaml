# RabbitMQ 4.2 cluster "rabbitmq" (Service rabbitmq.data-rabbitmq.svc is created by the operator).
#
# Sizing (1M users): ~5k msgs/s sustained, bursts 15k/s, avg 2 KB, publisher confirms + manual acks.
# Quorum queues replicate every message to 3 nodes (Raft); 4 vCPU / 12 GiB per node leaves headroom
# for backlogs of a few million messages (quorum queues keep only indexes in memory in 4.x).
# RabbitMQ 4.x removed classic mirrored queues ("ha-mode" policies): quorum queues ARE the HA
# mechanism; default_queue_type=quorum makes every queue declared without x-queue-type quorum.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: rabbitmq
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: platform-data
spec:
  replicas: 3
  image: rabbitmq:4.2.9-management # pin: verify latest before upgrade (supported by cluster-operator 2.19)
  delayStartSeconds: 30
  autoEnableAllFeatureFlags: true

  secretBackend:
    externalSecret:
      name: rabbitmq-default-user # ExternalSecret from Vault secret/platform/rabbitmq

  service:
    type: ClusterIP

  persistence:
    storageClassName: longhorn-db
    storage: 200Gi

  resources:
    requests:
      cpu: "4"
      memory: 12Gi
    limits:
      memory: 12Gi # operator derives total_memory_available_override_value from this limit

  tolerations:
    - key: workload-tier
      operator: Equal
      value: data
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload-tier
                operator: In
                values: [data]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq

  rabbitmq:
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_prometheus
      - rabbitmq_peer_discovery_k8s
      - rabbitmq_shovel
      - rabbitmq_shovel_management
      - rabbitmq_federation
      - rabbitmq_federation_management
    additionalConfig: |
      # --- queues -------------------------------------------------------------------------
      default_queue_type = quorum
      queue_leader_locator = balanced
      quorum_queue.continuous_membership_reconciliation.enabled = true
      quorum_queue.continuous_membership_reconciliation.target_group_size = 3
      # --- resource alarms -------------------------------------------------------------------
      # 60% of the 12 GiB limit before publishers are blocked (rest: Erlang VM, page cache, GC).
      vm_memory_high_watermark.relative = 0.6
      # Block publishers while < 10 GB disk is free on the 200 GiB volume.
      disk_free_limit.absolute = 10GB
      # --- partitions: the minority side pauses (safe with 3 nodes + quorum queues) ----------
      cluster_partition_handling = pause_minority
      # --- connections / protocol ------------------------------------------------------------
      heartbeat = 30
      channel_max = 1024
      max_message_size = 16777216
      consumer_timeout = 1800000
      # --- observability ----------------------------------------------------------------------
      log.console = true
      log.console.level = info
      log.console.formatter = json
      collect_statistics_interval = 10000
      prometheus.return_per_object_metrics = false

  # Optional TLS (AMQPS 5671 / management 15671): issue a Certificate from ClusterIssuer internal-ca
  # into secret rabbitmq-tls (dnsNames rabbitmq.data-rabbitmq.svc, *.rabbitmq-nodes.data-rabbitmq.svc)
  # and uncomment. Keep non-TLS listeners until all clients are migrated.
  # tls:
  #   secretName: rabbitmq-tls
  #   caSecretName: rabbitmq-tls
  #   disableNonTLSListeners: false

  override:
    statefulSet:
      spec:
        template:
          metadata:
            annotations:
              sidecar.istio.io/inject: "false"
          spec:
            priorityClassName: data-critical
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rabbitmq
            containers: []
