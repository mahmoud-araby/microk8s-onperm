# RabbitMQ credentials from Vault (ClusterSecretStore vault-backend):
#   secret/platform/rabbitmq          username, password        -> rabbitmq-default-user (administrator)
#   secret/platform/rabbitmq          platform-app-password     -> rabbitmq-user-platform-app
#   secret/platform/micro-integrator  rabbitmq-password         -> rabbitmq-user-micro-integrator
# Tenant users (<tenant>-<service>) are rendered by charts/tenant from secret/tenants/<tenant>/<service>.
#
# Default user: consumed by the cluster operator through spec.secretBackend.externalSecret; the
# Secret carries the same keys the operator would generate (username/password/default_user.conf/...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-default-user
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: rabbitmq-default-user
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        default_user.conf: |
          default_user = {{ .username }}
          default_pass = {{ .password }}
        host: rabbitmq.data-rabbitmq.svc
        port: "5672"
        provider: rabbitmq
        type: rabbitmq
  data:
    - secretKey: username
      remoteRef:
        key: platform/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: platform/rabbitmq
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-user-platform-app
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: rabbitmq-user-platform-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: platform-app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/rabbitmq
        property: platform-app-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-user-micro-integrator
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: rabbitmq-user-micro-integrator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: micro-integrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/micro-integrator
        property: rabbitmq-password
