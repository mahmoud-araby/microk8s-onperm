# WSO2 Micro Integrator (namespace integration): REST<->SOAP mediation to the hybrid legacy ERP,
# RabbitMQ and Kafka inbound endpoints. In the Istio mesh (sidecar), exposed internally at
# https://integration.internal.example.local through istio-internal/internal-gateway.
#   micro-integrator.integration.svc.cluster.local:8290 (HTTP) / :8253 (HTTPS)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: micro-integrator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: platform-data
    platform.example.com/category: data
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: data
  destination:
    server: https://kubernetes.default.svc
    namespace: integration
  sources:
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      path: gitops/platform/data/micro-integrator/manifests
      directory:
        recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        platform.example.com/category: integration
        istio-injection: enabled
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # HPA owns the replica count.
    - group: apps
      kind: Deployment
      name: micro-integrator
      jsonPointers:
        - /spec/replicas
