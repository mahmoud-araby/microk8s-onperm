# Micro Integrator secrets from Vault secret/platform/micro-integrator:
#   rabbitmq-password -> RABBITMQ_PASSWORD  (same key feeds RabbitMQ User "micro-integrator")
#   kafka-password    -> KAFKA_PASSWORD     (same key feeds KafkaUser "micro-integrator")
#   erp-api-key       -> ERP_API_KEY        (credential of the legacy ERP SOAP service)
# Injected as env vars and referenced from Synapse artifacts as $SYSTEM:<VAR>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: micro-integrator-secrets
  labels:
    app.kubernetes.io/name: micro-integrator
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: micro-integrator-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: platform/micro-integrator
        property: rabbitmq-password
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: platform/micro-integrator
        property: kafka-password
    - secretKey: ERP_API_KEY
      remoteRef:
        key: platform/micro-integrator
        property: erp-api-key
