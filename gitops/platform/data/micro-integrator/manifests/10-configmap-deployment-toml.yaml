# <MI_HOME>/conf/deployment.toml for WSO2 Micro Integrator 4.4.0.
# Ports (default offset 10): 8290 HTTP, 8253 HTTPS (pass-through transport), 9164 management API,
# 9201 internal HTTP API (health: /liveness, /healthz; Prometheus: /metric-service/metrics).
apiVersion: v1
kind: ConfigMap
metadata:
  name: micro-integrator-config
  labels:
    app.kubernetes.io/name: micro-integrator
    app.kubernetes.io/part-of: platform-data
data:
  deployment.toml: |
    [server]
    hostname = "micro-integrator.integration.svc.cluster.local"
    offset = 10
    hot_deployment = false          # immutable containers: artifacts change only through a rollout

    [user_store]
    type = "read_only_ldap"

    # Replace the default demo keystores with the platform ones (mounted from a Secret) before
    # exposing HTTPS 8253 to partners; mesh traffic is already mTLS via the Istio sidecar.
    [keystore.primary]
    file_name = "repository/resources/security/wso2carbon.jks"
    password = "wso2carbon"
    alias = "wso2carbon"
    key_password = "wso2carbon"

    [truststore]
    file_name = "repository/resources/security/client-truststore.jks"
    password = "wso2carbon"
    alias = "symmetric.key.value"
    algorithm = "AES"

    # --- pass-through HTTP transport tuning (3-10 pods x 400 workers) ---------------------------
    [transport.http]
    socket_timeout = 60000                 # ms; ERP calls are bounded by the endpoint timeout (10 s)
    core_worker_pool_size = 400
    max_worker_pool_size = 400
    worker_pool_queue_length = -1
    io_buffer_size = 16384
    max_http_connection_per_host_port = 2000
    max_open_connections = 20000
    preserve_http_user_agent = true
    disable_connection_keepalive = false
    sender.warn_on_http_500 = "*"

    # --- RabbitMQ transport (inbound endpoint uses its own parameters) --------------------------
    [transport.rabbitmq]
    listener_enable = true
    sender_enable = true

    # --- mediation ---------------------------------------------------------------------------------
    [mediation]
    synapse.global_timeout_interval = "120000"
    synapse.core_threads = 40
    synapse.max_threads = 200
    synapse.threads_queue_length = 1000
    inbound.core_threads = 40
    inbound.max_threads = 200
    # required for OpenTelemetry tracing of mediation flows
    flow.statistics.enable = true
    flow.statistics.capture_all = true

    # --- tracing to the platform OpenTelemetry Collector (OTLP gRPC) ----------------------------
    [opentelemetry]
    enable = true
    type = "otlp"
    url = "http://otel-collector.observability.svc.cluster.local:4317"

    # --- Prometheus metrics: /metric-service/metrics on 9201 (needs -DenablePrometheusApi=true) ---
    [[synapse_handlers]]
    name = "CustomObservabilityHandler"
    class = "org.wso2.micro.integrator.observability.metric.handler.MetricHandler"

    [prometheus_api]
    protocols = "http"

    # Management API (9164) kept for the MI CLI / troubleshooting; reached only via kubectl port-forward.
    [management_api]
    protocols = "https"

    # MI dashboard is NOT used (no [dashboard_config]); monitoring is Prometheus/Grafana + Elastic APM.
