# S3 (MinIO) credentials + CA of the on-prem object store used for WAL archiving and base backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-main-backup-s3
  labels:
    app.kubernetes.io/name: pg-main
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: pg-main-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: platform/postgres-backup
        property: ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: platform/postgres-backup
        property: ACCESS_SECRET_KEY
    - secretKey: ca.crt
      remoteRef:
        key: platform/postgres-backup
        property: ca.crt
