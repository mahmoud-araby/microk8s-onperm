# Credentials for pg-main, synced from Vault (ClusterSecretStore vault-backend, KV v2 mount "secret").
#
#   Vault path                          property             -> Secret (data-postgres)
#   secret/platform/postgres            superuser-password   -> pg-main-superuser      (break-glass, tenant role job)
#   secret/platform/postgres            platform-password    -> pg-main-app-platform   (role/db "platform")
#   secret/platform/keycloak            db-password          -> pg-main-role-keycloak  (role/db "keycloak")
#   secret/platform/harbor              db-password          -> pg-main-role-harbor    (role/db "harbor")
#   secret/platform/grafana             db-password          -> pg-main-role-grafana   (role/db "grafana")
#   secret/platform/postgres-backup     ACCESS_KEY_ID, ACCESS_SECRET_KEY, ca.crt -> pg-main-backup-s3
#
# Keycloak and Harbor read the SAME Vault keys for their DB passwords (single source of truth).
# CNPG requires kubernetes.io/basic-auth secrets and reloads roles when a secret labelled
# cnpg.io/reload changes, so password rotation in Vault propagates without restarts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-main-superuser
  labels:
    app.kubernetes.io/name: pg-main
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: pg-main-superuser
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: postgres
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/postgres
        property: superuser-password
---
