# Ingress isolation for data-postgres (egress is left open: WAL archive to MinIO, DR streaming).
# Tenant namespaces are matched by the label `platform.example.com/tenant` (set by charts/tenant).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: platform-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-and-operator
  labels:
    app.kubernetes.io/part-of: platform-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # Streaming replication, poolers -> instances, tenant role jobs, backups.
    - from:
        - podSelector: {}
    # CNPG operator -> instance manager status API (:8000) / pooler; barman plugin sidecar.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-clients
  labels:
    app.kubernetes.io/part-of: platform-data
spec:
  podSelector: {} # instances + PgBouncer pods, port 5432 only
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: platform.example.com/tenant
                operator: Exists
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [shared-services, integration, keycloak, harbor, data-kafka]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  labels:
    app.kubernetes.io/part-of: platform-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187 # postgres exporter
        - protocol: TCP
          port: 9127 # pgbouncer exporter
