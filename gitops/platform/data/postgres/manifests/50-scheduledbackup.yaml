# Daily base backup at 01:00 UTC (6-field cron: sec min hour dom mon dow) taken from a standby,
# plus continuous WAL archiving (Cluster.spec.plugins isWALArchiver) = point-in-time recovery.
# Weekly Longhorn volume snapshots/backups of the PVCs are an additional, independent layer
# (configured in gitops/platform/core/longhorn recurring jobs) and Velero covers the CRs.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-main-daily
  labels:
    app.kubernetes.io/name: pg-main
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: platform-data
spec:
  cluster:
    name: pg-main
  schedule: "0 0 1 * * *"
  immediate: true # first backup right after creation -> PITR is possible from day one
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
