# SQL Server secrets from Vault secret/platform/mssql.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mssql-secrets
  labels:
    app.kubernetes.io/name: mssql
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: mssql-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MSSQL_SA_PASSWORD
      remoteRef:
        key: platform/mssql
        property: sa-password
    - secretKey: AG_CERT_PASSWORD
      remoteRef:
        key: platform/mssql
        property: ag-cert-password
    - secretKey: AG_MASTER_KEY_PASSWORD
      remoteRef:
        key: platform/mssql
        property: ag-master-key-password
