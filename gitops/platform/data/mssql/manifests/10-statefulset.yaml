# OPTIONAL SQL Server 2022 for .NET workloads that require it (component disabled by default).
#
# LICENSE: the image is Microsoft SQL Server under the Microsoft EULA. ACCEPT_EULA=Y is a legal
# acceptance on behalf of your organisation. MSSQL_PID=Developer is NOT licensed for production -
# use "Standard" or "Enterprise" (or a product key) with per-core licences covering every data node
# that may schedule these pods (Always On AGs with readable secondaries need Enterprise).
#
# Topology: 3 independent SQL Server instances (one per data host) with HADR enabled, database
# mirroring endpoints on 5022 and stable DNS (mssql-N.mssql-headless.data-mssql.svc). An Always On
# availability group "ag1" (CLUSTER_TYPE = NONE -> manual failover, or EXTERNAL with an AG operator
# such as DH2i DxOperator for automatic failover) is created once with the script in
# 50-ag-bootstrap-configmap.yaml. Service `mssql` routes to the pod labelled
# mssql.platform.example.com/role=primary (label flipped by the failover runbook / AG operator).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  labels:
    app.kubernetes.io/name: mssql
    app.kubernetes.io/instance: mssql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: platform-data
    app.kubernetes.io/version: 2022-CU27
spec:
  replicas: 3
  serviceName: mssql-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mssql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mssql
        app.kubernetes.io/instance: mssql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: platform-data
        platform.example.com/language: dotnet
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      priorityClassName: data-critical
      terminationGracePeriodSeconds: 120
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        workload-tier: data
      tolerations:
        - key: workload-tier
          operator: Equal
          value: data
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mssql
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # mssql user of the official image
        runAsGroup: 0
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04 # pin: verify latest before upgrade (CUs are cumulative; 2025 series exists)
          imagePullPolicy: IfNotPresent
          ports:
            - name: tds
              containerPort: 1433
              protocol: TCP
            - name: hadr
              containerPort: 5022
              protocol: TCP
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer # CHANGE for production: Standard | Enterprise | <product key>
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secrets
                  key: MSSQL_SA_PASSWORD
            - name: MSSQL_ENABLE_HADR
              value: "1"
            - name: MSSQL_AGENT_ENABLED
              value: "true"
            - name: MSSQL_TCP_PORT
              value: "1433"
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "26624" # ~80% of the 32 GiB limit
            - name: MSSQL_DATA_DIR
              value: /var/opt/mssql/data
            - name: MSSQL_LOG_DIR
              value: /var/opt/mssql/tlog
            - name: MSSQL_BACKUP_DIR
              value: /var/opt/mssql/backup
            - name: MSSQL_COLLATION
              value: SQL_Latin1_General_CP1_CI_AS
            - name: TZ
              value: Etc/UTC
          startupProbe:
            tcpSocket:
              port: tds
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: tds
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -l 5 > /dev/null
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
            limits:
              memory: 32Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
            - name: tlog
              mountPath: /var/opt/mssql/tlog
            - name: ag-bootstrap
              mountPath: /opt/platform/ag
              readOnly: true
        - name: mssql-exporter
          image: awaragi/prometheus-mssql-exporter:v1.3.0 # pin: verify latest before upgrade
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 4000
              protocol: TCP
          env:
            - name: SERVER
              value: 127.0.0.1
            - name: PORT
              value: "1433"
            - name: USERNAME
              value: sa # use a dedicated login with VIEW SERVER STATE in production
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secrets
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: ag-bootstrap
          configMap:
            name: mssql-ag-bootstrap
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: mssql
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-db
        resources:
          requests:
            storage: 500Gi
    - metadata:
        name: tlog
        labels:
          app.kubernetes.io/name: mssql
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-db
        resources:
          requests:
            storage: 100Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
