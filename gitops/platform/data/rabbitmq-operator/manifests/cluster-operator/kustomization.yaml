# RabbitMQ Cluster Operator 2.19.2 (upstream release manifest). pin: verify latest before upgrade
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rabbitmq-system
resources:
  - https://github.com/rabbitmq/cluster-operator/releases/download/v2.19.2/cluster-operator.yml
labels:
  - pairs:
      app.kubernetes.io/part-of: platform-data
    includeSelectors: false
patches:
  # The namespace is created by Argo CD (CreateNamespace + managedNamespaceMetadata).
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rabbitmq-system
  # Operators run on the platform pool, two replicas with leader election.
  - target:
      kind: Deployment
      name: rabbitmq-cluster-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rabbitmq-cluster-operator
      spec:
        replicas: 2
        template:
          spec:
            nodeSelector:
              workload-tier: platform
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: rabbitmq-cluster-operator
