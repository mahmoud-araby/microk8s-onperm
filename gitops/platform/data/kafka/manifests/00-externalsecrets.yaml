# SCRAM-SHA-512 passwords of the platform KafkaUsers, from Vault (ClusterSecretStore vault-backend).
# The User Operator sets each KafkaUser's password from these Secrets (spec.authentication.password)
# and publishes Secret "<user>" (password + sasl.jaas.config) for in-namespace consumers.
#   secret/platform/kafka             admin-password, bridge-password, platform-services-password,
#                                     hybrid-consumer-password, mirrormaker2-password
#   secret/platform/micro-integrator  kafka-password
# Tenant users (<tenant>-<service>) are rendered by charts/tenant from secret/tenants/<tenant>/<service>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-admin-kafka-password
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: kafka-admin-kafka-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/kafka
        property: admin-password
---
