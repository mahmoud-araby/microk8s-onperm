# Kafka cluster `kafka` (Strimzi, KRaft): 3 controllers + 5 brokers, Cruise Control, entity operator,
# Kafka Exporter, HTTP bridge, platform topics/users.
#   kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9092 (SASL_PLAINTEXT, SCRAM-SHA-512)
#   kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9093 (SASL_SSL, SCRAM-SHA-512)
#   kafka-kafka-external-bootstrap (LoadBalancer on MetalLB internal-pool, :9094 SASL_SSL) - hybrid clients
#   kafka-bridge-bridge-service.data-kafka.svc.cluster.local:8080 (HTTP REST)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: platform-data
    platform.example.com/category: data
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: data
  destination:
    server: https://kubernetes.default.svc
    namespace: data-kafka
  sources:
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      path: gitops/platform/data/kafka/manifests
      directory:
        recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        platform.example.com/category: data
        istio-injection: disabled
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
