# OPTIONAL - Kafka Connect cluster with Debezium PostgreSQL CDC (outbox / change streams from
# pg-main to Kafka). Copy into ../manifests to enable. Prerequisites:
#   * pg-main: enable the commented "debezium" managed role (REPLICATION) + ExternalSecret
#     pg-main-role-debezium (Vault secret/platform/postgres property debezium-password).
#     CNPG runs with wal_level=logical by default, so no Postgres restart is needed.
#   * The same password as Secret data-kafka/pg-main-role-debezium (ExternalSecret, same Vault key) and
#     a Role/RoleBinding letting the connect-cdc-connect ServiceAccount `get` that Secret
#     (KubernetesSecretConfigProvider).
#   * A publication for the captured tables (CNPG Publication CR or `CREATE PUBLICATION`).
#   * Harbor project platform/ for the built Connect image + push secret "harbor-push".
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: connect-cdc
  namespace: data-kafka
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/part-of: platform-data
  annotations:
    strimzi.io/use-connector-resources: "true" # connectors are managed as KafkaConnector CRs
spec:
  version: 4.3.1
  replicas: 3
  bootstrapServers: kafka-kafka-bootstrap.data-kafka.svc:9093
  tls:
    trustedCertificates:
      - secretName: kafka-cluster-ca-cert
        pattern: "*.crt"
  authentication:
    type: scram-sha-512
    username: debezium-connect # add a KafkaUser with Write on "cdc." + Connect internal topics
    passwordSecret:
      secretName: debezium-connect-kafka-password
      password: password
  groupId: connect-cdc
  configStorageTopic: connect-cdc-configs
  offsetStorageTopic: connect-cdc-offsets
  statusStorageTopic: connect-cdc-status
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
  build:
    output:
      type: docker
      image: harbor.ops.example.local/platform/kafka-connect-debezium:4.3.1-3.6.3
      pushSecret: harbor-push
    plugins:
      - name: debezium-postgres
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.6.3.Final/debezium-connector-postgres-3.6.3.Final-plugin.tar.gz # pin: verify latest before upgrade
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {memory: 4Gi}
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: kafka-metrics
        key: kafka-metrics-config.yml
  template:
    pod:
      priorityClassName: data-critical
      tolerations:
        - key: workload-tier
          operator: Equal
          value: data
          effect: NoSchedule
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: pg-main-platform-outbox
  namespace: data-kafka
  labels:
    strimzi.io/cluster: connect-cdc
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1 # a Postgres logical slot is consumed by exactly one task
  config:
    database.hostname: pg-main-rw.data-postgres.svc.cluster.local
    database.port: "5432"
    database.user: debezium
    database.password: ${secrets:data-kafka/pg-main-role-debezium:password}
    database.dbname: platform
    database.sslmode: require
    topic.prefix: cdc.platform
    plugin.name: pgoutput
    slot.name: debezium_platform
    publication.name: debezium_platform
    publication.autocreate.mode: disabled
    table.include.list: public.outbox
    # Outbox pattern: route each outbox row to "platform.<aggregatetype>-events".
    transforms: outbox
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.route.topic.replacement: platform.${routedByValue}-events
    heartbeat.interval.ms: "10000"
    snapshot.mode: no_data
