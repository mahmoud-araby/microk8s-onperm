# Thanos object storage configuration (S3 API on MinIO - placeholder endpoint/bucket).
# Consumed by: Prometheus Thanos sidecar (kube-prometheus-stack values: thanos.objectStorageConfig),
# Thanos Store Gateway and Compactor. Vault: secret/platform/thanos {access-key, secret-key}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: thanos-objstore
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        objstore.yml: |
          type: S3
          config:
            bucket: thanos-metrics
            endpoint: minio.storage.example.local:9000
            region: us-east-1
            access_key: "{{ .accessKey }}"
            secret_key: "{{ .secretKey }}"
            insecure: false
            http_config:
              tls_config:
                insecure_skip_verify: false
          prefix: microk8s-prod
  data:
    - secretKey: accessKey
      remoteRef:
        key: platform/thanos
        property: access-key
    - secretKey: secretKey
      remoteRef:
        key: platform/thanos
        property: secret-key
