# Cross-namespace copy of ECK-generated secrets (they are created by the operator in "logging", not in Vault).
# ESO "kubernetes" provider: the ServiceAccount below is granted read access to a fixed list of secrets in
# "logging" by the Role/RoleBinding in gitops/platform/observability/elastic/manifests/eso-cross-namespace-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-logging-reader
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: observability
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: logging-namespace
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: observability
spec:
  provider:
    kubernetes:
      remoteNamespace: logging
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-logging-reader
---
# CA of the Elasticsearch HTTP layer (ECK self-signed) -> Grafana Elasticsearch datasources.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elasticsearch-ca
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: logging-namespace
  target:
    name: elasticsearch-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: elasticsearch-es-http-certs-public
        property: ca.crt
