# Secrets for Grafana and Alertmanager, sourced from Vault through the ClusterSecretStore "vault-backend"
# (KV v2 mount "secret"). Expected Vault keys:
#   secret/platform/grafana      admin-user, admin-password, db-user, db-password, secret-key, oidc-client-secret
#   secret/platform/elastic      grafana-password (same value is used for the ES file-realm user "grafana")
#   secret/platform/alertmanager pagerduty-routing-key, opsgenie-api-key, slack-webhook-url, smtp-password,
#                                deadmans-switch-url
# The Postgres role/database "grafana" must exist in CNPG cluster pg-main (data-postgres), with the password
# stored at secret/platform/grafana#db-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-env
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Database on CNPG pg-main (database "grafana")
        GF_DATABASE_USER: "{{ .dbUser }}"
        GF_DATABASE_PASSWORD: "{{ .dbPassword }}"
        # Must be identical on all replicas (encrypts datasource secrets stored in the DB)
        GF_SECURITY_SECRET_KEY: "{{ .secretKey }}"
        # Keycloak confidential client "grafana"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .oidcClientSecret }}"
        # Elasticsearch read-only file-realm user used by the Elasticsearch datasources
        ES_GRAFANA_USER: grafana
        ES_GRAFANA_PASSWORD: "{{ .esPassword }}"
  data:
    - secretKey: dbUser
      remoteRef:
        key: platform/grafana
        property: db-user
    - secretKey: dbPassword
      remoteRef:
        key: platform/grafana
        property: db-password
    - secretKey: secretKey
      remoteRef:
        key: platform/grafana
        property: secret-key
    - secretKey: oidcClientSecret
      remoteRef:
        key: platform/grafana
        property: oidc-client-secret
    - secretKey: esPassword
      remoteRef:
        key: platform/elastic
        property: grafana-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: alertmanager-receivers
    creationPolicy: Owner
  data:
    - secretKey: pagerduty-routing-key
      remoteRef:
        key: platform/alertmanager
        property: pagerduty-routing-key
    - secretKey: opsgenie-api-key
      remoteRef:
        key: platform/alertmanager
        property: opsgenie-api-key
    - secretKey: slack-webhook-url
      remoteRef:
        key: platform/alertmanager
        property: slack-webhook-url
    - secretKey: smtp-password
      remoteRef:
        key: platform/alertmanager
        property: smtp-password
    - secretKey: deadmans-switch-url
      remoteRef:
        key: platform/alertmanager
        property: deadmans-switch-url
