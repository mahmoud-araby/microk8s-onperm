            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "description": "Prometheus (15d, HA) or Thanos (2y, downsampled)"
