# GENERATED dashboard "Circuit Breakers & Retries" (uid circuit-breakers) - Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard="1" from all namespaces into folder "Services" (annotation grafana_folder).
# Edit the JSON (or export from Grafana UI) and keep it valid JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-circuit-breakers
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
  annotations:
    grafana_folder: Services
data:
