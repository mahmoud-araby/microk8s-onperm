          {
            "name": "namespace",
            "label": "Caller namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(envoy_cluster_upstream_rq_total, namespace)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(envoy_cluster_upstream_rq_total, namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "hide": 0,
            "regex": "",
            "current": {},
            "allValue": ".*"
          },
          {
            "name": "upstream",
            "label": "Upstream service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(envoy_cluster_upstream_rq_total{cluster_name=~\"outbound\\\\|.*\"}, cluster_name)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(envoy_cluster_upstream_rq_total{cluster_name=~\"outbound\\\\|.*\"}, cluster_name)",
