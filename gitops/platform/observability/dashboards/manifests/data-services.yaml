# GENERATED dashboard "Data Services Summary" (uid data-services) - Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard="1" from all namespaces into folder "Data" (annotation grafana_folder).
# Edit the JSON (or export from Grafana UI) and keep it valid JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-data-services
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
  annotations:
    grafana_folder: Data
data:
  data-services.json: |
