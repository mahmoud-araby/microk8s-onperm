# GENERATED dashboard "Kong API Gateway" (uid kong-gateway) - Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard="1" from all namespaces into folder "Platform" (annotation grafana_folder).
# Edit the JSON (or export from Grafana UI) and keep it valid JSON.
apiVersion: v1
