          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, service) (slo:sli_requests:rate5m{tenant=~\"$tenant\", namespace=~\"$namespace\"})",
