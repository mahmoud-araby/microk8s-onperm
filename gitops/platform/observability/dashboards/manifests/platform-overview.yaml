# GENERATED dashboard "Platform Overview & SLOs" (uid platform-overview) - Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard="1" from all namespaces into folder "Platform" (annotation grafana_folder).
# Edit the JSON (or export from Grafana UI) and keep it valid JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
  annotations:
    grafana_folder: Platform
data:
  platform-overview.json: |
    {
      "uid": "platform-overview",
      "title": "Platform Overview & SLOs",
      "description": "Live platform health: traffic, errors, latency (Istio server-side), SLO burn and error budget per service and tenant, synthetic probes.",
      "tags": [
        "platform",
        "slo",
        "istio"
      ],
      "timezone": "utc",
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m"
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "description": "Prometheus (15d, HA) or Thanos (2y, downsampled)"
          },
          {
            "name": "tenant",
            "label": "Tenant",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(slo:sli_requests:rate5m, tenant)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(slo:sli_requests:rate5m, tenant)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "hide": 0,
            "regex": "",
            "current": {},
            "allValue": ".*"
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(slo:sli_requests:rate5m, namespace)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(slo:sli_requests:rate5m, namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "hide": 0,
            "regex": "",
            "current": {},
            "allValue": ".*"
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "links": [
        {
          "title": "Platform dashboards",
          "type": "dashboards",
          "tags": [
            "platform"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Golden signals (all mesh services)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / s",
          "description": "Server-side requests per second across all selected services.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(slo:sli_requests:rate5m{tenant=~\"$tenant\", namespace=~\"$namespace\"})",
              "legendFormat": "__auto",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error ratio (5xx)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(slo:sli_errors:rate5m{tenant=~\"$tenant\", namespace=~\"$namespace\"}) / sum(slo:sli_requests:rate5m{tenant=~\"$tenant\", namespace=~\"$namespace\"})",
              "legendFormat": "__auto",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.001
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 latency",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
