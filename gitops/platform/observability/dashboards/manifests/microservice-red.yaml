# GENERATED dashboard "Microservice RED" (uid microservice-red) - Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard="1" from all namespaces into folder "Services" (annotation grafana_folder).
# Edit the JSON (or export from Grafana UI) and keep it valid JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-microservice-red
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
  annotations:
    grafana_folder: Services
data:
  microservice-red.json: |
    {
      "uid": "microservice-red",
      "title": "Microservice RED",
      "description": "Rate / Errors / Duration of one service release (e.g. orders-v1), split by revision so a canary (new image tag) is compared with stable during an Argo Rollouts canary.",
      "tags": [
        "platform",
        "services",
        "istio",
        "rollouts"
      ],
      "timezone": "utc",
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m"
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "description": "Prometheus (15d, HA) or Thanos (2y, downsampled)"
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(istio_requests_total{reporter=\"destination\"}, destination_workload_namespace)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(istio_requests_total{reporter=\"destination\"}, destination_workload_namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "regex": "",
            "current": {}
          },
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"$namespace\"}, destination_service_name)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"$namespace\"}, destination_service_name)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "regex": "",
            "current": {}
          },
          {
            "name": "revision",
            "label": "Revision (image tag)",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"$namespace\", destination_service_name=\"$service\"}, destination_canonical_revision)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"$namespace\", destination_service_name=\"$service\"}, destination_canonical_revision)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "hide": 0,
            "regex": "",
            "current": {},
            "allValue": ".*"
          },
          {
            "name": "app",
            "label": "App (OTel service.name)",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"$namespace\", destination_service_name=\"$service\"}, destination_canonical_service)",
              "refId": "StandardVariableQuery"
            },
            "definition": "label_values(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"$namespace\", destination_service_name=\"$service\"}, destination_canonical_service)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "regex": "",
            "current": {}
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "links": [
        {
          "title": "Platform dashboards",
          "type": "dashboards",
          "tags": [
            "platform"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true
