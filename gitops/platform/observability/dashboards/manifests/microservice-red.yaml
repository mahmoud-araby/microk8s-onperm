          "icon": "external link"
        },
        {
          "title": "Logs in Kibana",
          "type": "link",
          "url": "https://kibana.ops.example.local/app/discover#/?_a=(query:(language:kuery,query:'kubernetes.namespace_name:\"${namespace}\"'))",
          "targetBlank": true,
          "icon": "external link"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / s",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
