# OpenTelemetry Operator (CRDs OpenTelemetryCollector / Instrumentation / TargetAllocator + webhooks).
# Wave -10 like every operator; the collectors and Instrumentation CRs are in ../opentelemetry (wave 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/part-of: observability
    platform.example.com/category: observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-operator
      targetRevision: 0.123.1 # pin: verify latest before upgrade (operator/collector 0.159.0)
      helm:
        releaseName: opentelemetry-operator
        valueFiles:
          - $values/gitops/platform/observability/opentelemetry-operator/values.yaml
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # large CRDs
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
