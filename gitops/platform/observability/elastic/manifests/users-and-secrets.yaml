# Elasticsearch service users (file realm, least privilege) and secrets.
#
# Credential choice for Fluent Bit / Grafana / exporter: instead of copying the "elastic" superuser secret
# (elasticsearch-es-elastic-user) around, each client gets a dedicated file-realm user whose password lives
# in Vault (secret/platform/elastic). ECK loads the users from these basic-auth Secrets (key "roles" =
# comma-separated role names) - rotation = change Vault, ESO refreshes, ECK reloads, clients restart.
# Fluent Bit runs in this namespace and mounts es-user-fluent-bit directly.
#
# Vault secret/platform/elastic keys: fluent-bit-password, grafana-password, exporter-password
# Vault secret/platform/elastic-snapshots keys: access-key, secret-key (MinIO bucket es-snapshots)
apiVersion: v1
kind: Secret
metadata:
  name: es-custom-roles
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: observability
type: Opaque
stringData:
  roles.yml: |
    fluent_bit_writer:
      cluster: ["monitor"]
      indices:
        - names: ["logs-*-k8s"]
          privileges: ["create_doc", "auto_configure", "view_index_metadata"]
    grafana_reader:
      cluster: ["monitor"]
      indices:
        - names: ["logs-*", "traces-apm*", "metrics-apm*"]
          privileges: ["read", "view_index_metadata"]
    exporter_monitor:
      cluster: ["monitor", "read_slm", "read_ilm"]
      indices:
        - names: ["*"]
          privileges: ["monitor"]
          allow_restricted_indices: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-user-fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: es-user-fluent-bit
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: fluent-bit
        password: "{{ .password }}"
        roles: fluent_bit_writer
  data:
    - secretKey: password
      remoteRef:
        key: platform/elastic
        property: fluent-bit-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-user-grafana
  namespace: logging
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: es-user-grafana
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: grafana
        password: "{{ .password }}"
        roles: grafana_reader
  data:
    - secretKey: password
      remoteRef:
        key: platform/elastic
        property: grafana-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-user-exporter
  namespace: logging
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: es-user-exporter
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: exporter
        password: "{{ .password }}"
        roles: exporter_monitor
  data:
    - secretKey: password
      remoteRef:
        key: platform/elastic
        property: exporter-password
---
# Keystore entries for the S3 snapshot repository client "default" (endpoint set in elasticsearch.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-snapshot-s3-credentials
  namespace: logging
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: es-snapshot-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: s3.client.default.access_key
      remoteRef:
        key: platform/elastic-snapshots
        property: access-key
    - secretKey: s3.client.default.secret_key
      remoteRef:
        key: platform/elastic-snapshots
        property: secret-key
