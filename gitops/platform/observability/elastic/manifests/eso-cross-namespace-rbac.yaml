# Lets the ESO "kubernetes" provider SecretStores in monitoring and observability read ONLY the ECK-generated
# public CA / APM token secrets from this namespace (they cannot be stored in Vault because ECK generates them).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-cross-namespace-reader
  namespace: logging
  labels:
    app.kubernetes.io/part-of: observability
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - elasticsearch-es-http-certs-public
      - apm-server-apm-http-certs-public
      - apm-server-apm-token
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-cross-namespace-reader
  namespace: logging
  labels:
    app.kubernetes.io/part-of: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-cross-namespace-reader
subjects:
  - kind: ServiceAccount
    name: eso-logging-reader
    namespace: monitoring
  - kind: ServiceAccount
    name: eso-logging-reader
    namespace: observability
