# GENERATED by a helper script - edit the JSON documents below directly (they are plain ES API bodies).
# Elasticsearch bootstrap: ILM policies, index templates, APM retention, snapshot repository + SLM.
# Runs as an Argo CD PostSync hook after every sync of the "elastic" Application (idempotent PUTs).
#
# Log data streams: Fluent Bit writes to logs-<namespace>-k8s (Logstash_Format + Logstash_Prefix_Key
# "logs-<namespace>" + constant Logstash_DateFormat "k8s"), matched by index template "logs-k8s".
#   ILM logs-k8s  : hot rollover 1d or 50GB/primary shard -> warm at 7d (forcemerge, best_compression,
#                   0 replicas: immutable + snapshotted) -> delete at 30d
#   ILM apm-traces: rollover 1d/50GB -> warm 2d -> delete 7d
#   ILM apm-logs  : rollover 1d/50GB -> warm 7d -> delete 30d
#   ILM apm-metrics: rollover 7d/50GB -> warm 7d -> delete 90d
# Snapshots: S3 repository "minio-s3" (bucket es-snapshots, MinIO placeholder), SLM "nightly-snapshots"
# 01:30 UTC daily, keep 35 days (min 7, max 60).
apiVersion: v1
kind: ConfigMap
metadata:
  name: es-bootstrap
  namespace: logging
  labels:
    app.kubernetes.io/name: es-bootstrap
    app.kubernetes.io/part-of: observability
data:
  bootstrap.sh: |
    #!/bin/bash
    # Idempotent bootstrap of ILM policies, index/component templates, snapshot repository and SLM policy.
    # Hard steps fail the Job (and the Argo CD sync); soft steps (snapshots, placeholder MinIO) only warn.
    set -uo pipefail
    ES="https://elasticsearch-es-http.logging.svc.cluster.local:9200"
    CURL=(curl -sS --cacert /certs/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json")
    echo "waiting for Elasticsearch..."
    for i in $(seq 1 120); do
      status=$("${CURL[@]}" "${ES}/_cluster/health?timeout=10s" 2>/dev/null | grep -o '"status":"[a-z]*"' || true)
      case "$status" in *green*|*yellow*) echo "cluster $status"; break;; esac
      sleep 10
    done
    rc=0
    call() { # method path file hard
      local code
      code=$("${CURL[@]}" -o /tmp/resp -w '%{http_code}' -X "$1" "${ES}/$2" --data-binary "@/bootstrap/$3")
      echo "$1 $2 -> ${code} $(head -c 300 /tmp/resp)"
      case "$code" in
        2*) ;;
        *) if [ "$4" = "hard" ]; then rc=1; else echo "WARN: soft step failed: $2"; fi ;;
      esac
    }
    call PUT "_cluster/settings" cluster-settings.json hard
    call PUT "_ilm/policy/logs-k8s" ilm-logs-k8s.json hard
    call PUT "_ilm/policy/apm-traces" ilm-apm-traces.json hard
    call PUT "_ilm/policy/apm-logs" ilm-apm-logs.json hard
    call PUT "_ilm/policy/apm-metrics" ilm-apm-metrics.json hard
    call PUT "_component_template/traces@custom" component-traces_at_custom.json hard
    call PUT "_component_template/traces-apm@custom" component-traces-apm_at_custom.json hard
    call PUT "_component_template/logs-apm.error@custom" component-logs-apm.error_at_custom.json hard
    call PUT "_component_template/logs-apm.app@custom" component-logs-apm.app_at_custom.json hard
    call PUT "_component_template/metrics@custom" component-metrics_at_custom.json hard
    call PUT "_index_template/logs-k8s" index-template-logs-k8s.json hard
    call PUT "_snapshot/minio-s3?verify=false" snapshot-repo-minio.json soft
    call PUT "_slm/policy/nightly-snapshots" slm-nightly.json soft
    exit $rc
