---
apiVersion: batch/v1
kind: Job
metadata:
  name: es-bootstrap
  namespace: logging
  labels:
    app.kubernetes.io/name: es-bootstrap
    app.kubernetes.io/part-of: observability
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-bootstrap
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        workload-tier: observability
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
        command:
        - /bin/bash
        - /bootstrap/bootstrap.sh
        env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-es-elastic-user
              key: elastic
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: ca
          mountPath: /certs
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: bootstrap
        configMap:
          name: es-bootstrap
          defaultMode: 365
      - name: ca
        secret:
          secretName: elasticsearch-es-http-certs-public
      - name: tmp
        emptyDir: {}
