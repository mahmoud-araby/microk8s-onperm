# Elastic APM Server "apm-server" -> service apm-server-apm-http.logging.svc.cluster.local:8200 (TLS, ECK
# self-signed). Receives OTLP (gRPC + HTTP on 8200) from the OpenTelemetry Collector sampler tier only;
# applications never talk to APM directly. Auth: secret token in Secret "apm-server-apm-token"
# (generated by ECK, copied to the observability namespace by ESO, see ../opentelemetry/manifests).
# Data lands in the APM data streams traces-apm*, logs-apm.*, metrics-apm.* (retention set by the
# bootstrap job, see es-bootstrap-job.yaml).
apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: apm-server
  namespace: logging
  labels:
    app.kubernetes.io/name: apm-server
    app.kubernetes.io/part-of: observability
spec:
  version: 8.19.22 # pin: verify latest before upgrade (same as Elasticsearch)
  count: 3
  elasticsearchRef:
    name: elasticsearch
  kibanaRef:
    name: kibana
  http:
    tls:
      selfSignedCertificate:
        subjectAltNames:
          - dns: apm-server-apm-http.logging.svc.cluster.local
          - dns: apm-server-apm-http.logging.svc
  config:
    apm-server:
      # Tail sampling happens in the OTel collector; APM stores everything it receives.
      max_event_size: 1048576
      read_timeout: 60s
      write_timeout: 60s
      shutdown_timeout: 25s
      capture_personal_data: false
      rum:
        enabled: false
    # Batch sizes for ~20k sampled spans/s across 3 replicas
    output.elasticsearch:
      flush_bytes: 2MB
      flush_interval: 1s
    logging.level: info
    logging.json: true
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: apm-server
    spec:
      nodeSelector:
        workload-tier: observability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    apm.k8s.elastic.co/name: apm-server
      containers:
        - name: apm-server
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apm-server
  namespace: logging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      apm.k8s.elastic.co/name: apm-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kibana
  namespace: logging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      kibana.k8s.elastic.co/name: kibana
