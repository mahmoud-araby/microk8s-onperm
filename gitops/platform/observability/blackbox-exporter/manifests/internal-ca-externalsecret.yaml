# Public certificate of the on-prem CA behind ClusterIssuer "internal-ca" (Vault secret/platform/pki#ca.crt)
# so the blackbox exporter verifies TLS of *.ops.example.local instead of skipping verification.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: internal-ca-bundle
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: internal-ca-bundle
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform/pki
        property: ca.crt
