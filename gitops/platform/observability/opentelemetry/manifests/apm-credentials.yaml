# APM Server secret token + TLS CA are generated by ECK in namespace "logging"; they are copied here with the
# ESO "kubernetes" provider (read access limited to these secrets by
# ../../elastic/manifests/eso-cross-namespace-rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-logging-reader
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: logging-namespace
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  provider:
    kubernetes:
      remoteNamespace: logging
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-logging-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apm-server-credentials
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: logging-namespace
  target:
    name: apm-server-credentials
    creationPolicy: Owner
  data:
    - secretKey: secret-token
      remoteRef:
        key: apm-server-apm-token
        property: secret-token
    - secretKey: ca.crt
      remoteRef:
        key: apm-server-apm-http-certs-public
        property: ca.crt
