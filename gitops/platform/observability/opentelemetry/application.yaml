# OpenTelemetry Collectors + auto-instrumentation (namespace "observability").
#   otel         (gateway, Deployment 3..12 via HPA) -> Service otel-collector:4317/4318 (contract endpoint)
#   otel-sampler (tail sampling tier, receives traces from the gateway via the loadbalancing exporter)
#   platform-instrumentation (Instrumentation CR for java / dotnet / python opt-in injection)
# Requires the OpenTelemetry Operator (../opentelemetry-operator, wave -10).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: observability
    platform.example.com/category: observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
    targetRevision: main
    path: gitops/platform/observability/opentelemetry/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: observability
        platform.example.com/category: observability
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
