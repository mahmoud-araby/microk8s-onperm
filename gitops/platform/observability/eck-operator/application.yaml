# Elastic Cloud on Kubernetes operator (CRDs + operator) - wave -10 like every other operator.
# The Elasticsearch / Kibana / APM Server CRs live in ../elastic (namespace logging, wave 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/part-of: observability
    platform.example.com/category: observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  sources:
    - repoURL: https://helm.elastic.co
      chart: eck-operator
      targetRevision: 3.5.0 # pin: verify latest before upgrade
      helm:
        releaseName: eck-operator
        valueFiles:
          - $values/gitops/platform/observability/eck-operator/values.yaml
    - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # ECK CRDs are too large for client-side apply
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
