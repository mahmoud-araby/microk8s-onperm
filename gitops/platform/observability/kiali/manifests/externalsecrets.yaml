# Vault secret/platform/kiali keys: oidc-client-secret (Keycloak client "kiali"), grafana-token (Grafana
# service account token with Viewer role, used to list dashboards).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app.kubernetes.io/name: kiali
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: kiali
    creationPolicy: Owner
  data:
    - secretKey: oidc-secret
      remoteRef:
        key: platform/kiali
        property: oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-grafana
  namespace: istio-system
  labels:
    app.kubernetes.io/name: kiali
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: kiali-grafana
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/kiali
        property: grafana-token
