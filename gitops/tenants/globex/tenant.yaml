# Tenant descriptor (see acme/tenant.yaml for the field reference).
# globex is the platform's canary tenant: its releases sync first in every progressive rollout and it
# runs early-access majors (catalog v2).
name: globex
displayName: Globex Corporation
tier: dedicated
environment: production
namespace: tenant-globex
releaseRing: canary
quota:
  cpu: "24"
  memory: 48Gi
  pods: "200"
  # catalog v2: one 5Gi generic ephemeral volume (local-nvme) per replica, up to 80 replicas + canary surge.
  pvcs: "110"
  storage: 700Gi
  loadBalancers: "0"
  limitsMemory: 96Gi
  requestsEphemeralStorage: 300Gi
  limitsEphemeralStorage: 1200Gi

values:
  rbac:
    adminGroups: [globex-admins]
    developerGroups: [globex-devs]
    viewerGroups: [globex-viewers, globex-auditors]
  istio:
    injection: true
    mtls: STRICT
  data:
    postgres:
      enabled: true
      databases: [orders, payments, catalog]
    redis:
      db: 2
      keyPrefix: "globex:"
    rabbitmq:
      enabled: true
      vhost: globex
      users: [orders, payments]
    kafka:
      enabled: true
      users: [orders, payments, catalog]
      topics:
        - {name: orders-events, partitions: 12, replicas: 3}
        - {name: payments-events, partitions: 6, replicas: 3}
        - {name: inventory-events, partitions: 6, replicas: 3}
    objectStorage:
      enabled: true
      buckets: [files]
      quota: 500GiB
      volumes:
        - {name: product-images, bucket: globex-files, prefix: images/, size: 50Gi, readOnly: true}
  kong:
    consumer:
      rateLimit:
        minute: 15000
        hour: 500000
  keycloak:
    realm: globex
