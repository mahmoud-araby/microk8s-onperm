# =============================================================================
# TEMPLATE - copy this directory to gitops/tenants/<name>/ and replace every CHANGE-ME.
# gitops/tenants/_template/ is excluded from both ApplicationSets (tenants.yaml, services.yaml).
#
# Top-level keys are ApplicationSet generator parameters - keep ALL of them (missingkey=error).
# `values:` is passed to charts/tenant as helm.valuesObject (deep-merged over the summary keys);
# see charts/tenant/values.yaml for every option.
# =============================================================================
# Tenant id: lowercase DNS label, max 20 chars. Must equal the directory name.
name: CHANGE-ME
displayName: CHANGE-ME Inc.
# dedicated -> namespace tenant-<name>, own releases (services/*.yaml), host <name>.api.example.com
# shared    -> pooled in shared-services (no services/ directory!), host api.example.com
tier: dedicated
environment: production
# tenant-<name> for dedicated, shared-services for shared
namespace: tenant-CHANGE-ME
# canary | early | general - order in which this tenant's releases receive new images (RollingSync)
releaseRing: general
# Namespace ResourceQuota (dedicated only). Size from docs/capacity-planning.md.
quota:
  cpu: "16"
  memory: 32Gi
  pods: "150"
  pvcs: "10"
  storage: 100Gi
  loadBalancers: "0"
  limitsMemory: 64Gi

values:
  rbac:
    # Keycloak groups of the tenant realm (API server OIDC prefix "oidc:" is added by the chart)
    adminGroups: [CHANGE-ME-admins]
    developerGroups: [CHANGE-ME-devs]
    viewerGroups: [CHANGE-ME-viewers]
  istio:
    injection: true
    mtls: STRICT
  networkPolicy:
    enabled: true
  data:
    postgres:
      enabled: true
      # One CNPG Database per service that needs Postgres -> <name>_<db>
      databases: [orders, payments, catalog]
    redis:
      # Pick a free logical DB (acme=1, globex=2, ...) and mirror it in values-microservice.yaml
      db: 0
      keyPrefix: "CHANGE-ME:"
    rabbitmq:
      enabled: true
      vhost: CHANGE-ME
      users: [orders, payments]
    kafka:
      enabled: true
      users: [orders, payments, catalog]
      topics:
        - {name: orders-events, partitions: 6, replicas: 3}
        - {name: payments-events, partitions: 6, replicas: 3}
        - {name: inventory-events, partitions: 6, replicas: 3}
  externalSecrets:
    enabled: true
  kong:
    consumer:
      rateLimit:
        minute: 6000
        hour: 200000
  keycloak:
    realm: CHANGE-ME
