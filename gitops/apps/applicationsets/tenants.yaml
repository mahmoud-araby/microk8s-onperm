# =============================================================================
# Tenant landing zones: one Application "tenant-<name>" per gitops/tenants/<name>/tenant.yaml.
# Synced by the bootstrap Application "tenants-and-apps" (wave 10).
#
# Sources of each generated Application:
#   1. charts/tenant, values = tenant.yaml summary keys (tenant.*, quota) deep-merged with tenant.yaml `values:`
#   2. gitops/tenants/<name>/configmaps (plain manifests; generated by the Ansible role k8s_configmaps).
#      Every tenant directory keeps at least configmaps/tenant-feature-flags.yaml, because Argo CD reports a
#      ComparisonError for a directory source whose path does not exist.
#
# gitops/tenants/_template/ is excluded. Requires AppProject "tenants" (see charts/tenant/README.md).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    platform.example.com/category: tenants
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
        revision: main
        files:
          - path: gitops/tenants/*/tenant.yaml
          - path: gitops/tenants/_template/tenant.yaml
            exclude: true
  syncPolicy:
    # Deleting a tenant directory deletes the Application (and its resources, except the Namespace, which is
    # protected by charts/tenant tenant.protectNamespace, and CNPG databases, which use reclaimPolicy retain).
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'tenant-{{ .name }}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: platform
        platform.example.com/category: tenants
        platform.example.com/tenant: '{{ .name }}'
        platform.example.com/tier: '{{ .tier }}'
        platform.example.com/environment: '{{ .environment }}'
        platform.example.com/release-ring: '{{ .releaseRing }}'
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: tenants
      # sources: rendered by templatePatch below (needs toYaml for the values object).
      sources: []
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      ignoreDifferences:
        # ESO defaults these fields server-side.
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[]?.remoteRef.conversionStrategy
            - .spec.data[]?.remoteRef.decodingStrategy
            - .spec.data[]?.remoteRef.metadataPolicy
            - .spec.dataFrom[]?.extract.conversionStrategy
            - .spec.dataFrom[]?.extract.decodingStrategy
            - .spec.dataFrom[]?.extract.metadataPolicy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The Namespace is part of the chart (labels, PSA, annotations) - never auto-created by Argo CD.
          - CreateNamespace=false
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    {{- $values := dict
          "tenant" (dict
              "name" .name
              "displayName" .displayName
              "tier" .tier
              "environment" .environment
              "namespace" .namespace
              "releaseRing" .releaseRing)
          "quota" (dig "quota" dict .) }}
    {{- if hasKey . "values" }}{{- if .values }}
    {{- $values = mergeOverwrite $values (deepCopy .values) }}
    {{- end }}{{- end }}
    spec:
      sources:
        - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
          targetRevision: main
          path: charts/tenant
          helm:
            releaseName: tenant-{{ .name }}
            valuesObject:
              {{- toYaml $values | nindent 14 }}
        - repoURL: https://github.com/mahmoud-araby/microk8s-onperm.git
          targetRevision: main
          path: gitops/tenants/{{ .name }}/configmaps
          directory:
            recurse: false
            include: '*.{yaml,yml}'
