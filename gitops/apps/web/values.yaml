# =============================================================================
# web - SPA frontend, service-wide defaults. Chart: charts/frontend (nginx, runtime config.js per tenant).
# Tenant wiring (tenant, hosts, runtimeConfig.apiBaseUrl/authUrl/tenantId) is injected by the services
# ApplicationSet, so one image serves every tenant without a rebuild.
# =============================================================================
name: web

image:
  registry: harbor.ops.example.local
  repository: platform/web

replicaCount: 3

runtimeConfig:
  apiBaseUrl: https://api.example.com
  authUrl: https://keycloak.example.com/realms/shared
  tenantId: ""
  # API major versions the SPA calls (must be deployed for the tenant - see gitops/tenants/<t>/services/).
  apiVersions:
    orders: v2
    payments: v1
    catalog: v1

hosts: [app.example.com]

kong:
  enabled: true
  rateLimit:
    minute: 6000

tls:
  enabled: true
  issuer: letsencrypt-prod

cache:
  htmlMaxAge: 0
  assetsMaxAge: 31536000

securityHeaders:
  csp: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

rollout:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi

# Static assets from MinIO (optional, disabled). Sync mode = no FUSE, no privileges: an init container
# (minio/mc) mirrors <tenant>-files/web/media/ into an emptyDir before nginx starts, a native sidecar re-syncs
# every 5 minutes; nginx serves it read-only under /media/. Requires objectStorage in the tenant's tenant.yaml
# (Secret tenant-s3-credentials + internal-ca-bundle). Content changes without a new image, so keep file names
# fingerprinted or rely on cache.staticMaxAge.
objectStorage:
  enabled: false
  mounts: []
  #  - name: media
  #    mode: sync
  #    mountPath: /usr/share/nginx/html/media
  #    readOnly: true
  #    prefix: web/media/
  #    direction: pull
  #    interval: 300
  #    remove: true
  #    volume: {type: emptyDir, sizeLimit: 2Gi}

autoscaling:
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    cpu: 70

pdb:
  enabled: true
  minAvailable: "50%"

nodeSelector:
  workload-tier: apps
